<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ett pass – hemtjänsten</title>
<meta name="theme-color" content="#f3e3cf">
<style>
:root{
  --bg:#f3e3cf; --card:#fffaf3; --ink:#3f2620; --soft:#7a5a4e; --line:#e2cdb5;
  --green:#4f7a4a; --green-bg:#e3eedd; --red:#b5533c; --red-bg:#f6e0d9; --accent:#c9673f;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:900px;margin:0 auto;padding:12px 16px 32px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 26px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:19px;box-shadow:0 3px 0 #9c4d2d}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9c4d2d}
.btn:disabled{opacity:.4;box-shadow:none;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.progress{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.icon-btn{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 var(--line);flex:none}
/* Start */
.hero{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:#dfe8ee center/cover}
.hero h1{position:absolute;top:8%;left:0;right:0;text-align:center;margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:.5px;color:var(--ink);text-shadow:0 2px 0 #fff8}
.hero p{position:absolute;top:calc(8% + clamp(44px,10vw,80px));left:0;right:0;text-align:center;margin:0;font-size:clamp(16px,3vw,22px);color:var(--soft)}
.center{text-align:center;margin-top:20px}
.lead{font-size:20px;max-width:560px;margin:16px auto}
.small{font-size:15px;color:var(--soft)}
/* Scen */
.scene{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:#eee center/cover;transition:background-image .3s}
.room{position:absolute;top:10px;right:10px;background:#fffaf3e6;border-radius:99px;padding:4px 14px;font-size:15px;font-weight:600}
.patient{position:absolute;left:10px;bottom:10px;width:30%;max-width:210px;background:var(--card);border-radius:14px;padding:6px 6px 4px;box-shadow:0 4px 14px #0002;text-align:center}
.patient img{width:100%;aspect-ratio:1;border-radius:10px;display:block;object-fit:cover}
.patient b{display:block;font-size:16px;padding-top:2px}
.patient.pop img{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.06)}}
.panel{background:var(--card);border-radius:var(--radius);padding:16px;margin-top:12px;box-shadow:0 2px 0 var(--line)}
.say{display:flex;gap:12px;align-items:flex-start}
.say .txt{flex:1;font-size:21px;font-weight:600}
.say .txt.quote{font-style:italic}
.say .txt.quote::before{content:"”"}.say .txt.quote::after{content:"”"}
.ask{margin:12px 0 4px;color:var(--soft);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.list{display:grid;gap:10px;margin-top:10px}
.opt{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;min-height:56px;text-align:center;transition:border-color .2s,background .2s}
.opt:active{transform:scale(.98)}
.opt svg{width:100%;max-width:120px;height:auto;display:block;margin:0 auto}
.opt img.hm{width:100%;max-width:170px;aspect-ratio:1;display:block;margin:0 auto;border-radius:10px}
.opt .lbl{display:block;overflow-wrap:break-word;hyphens:manual;font-weight:700;font-size:17px;min-height:1.4em}
.opt .lbl.hidden{visibility:hidden}
.opt .lbl.lang{font-size:14px;letter-spacing:-.2px}
@media (max-width:380px){.opt .lbl.lang{font-size:12.5px;letter-spacing:-.3px}}
.opt .fack{display:block;font-size:14px;color:var(--soft);font-weight:400}
.list .opt{text-align:left;padding:12px 16px;font-size:19px;font-weight:600}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg);opacity:.75}
.opt.done{pointer-events:none}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;font-size:18px;display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:var(--green-bg)}.fb.no{background:var(--red-bg)}
.fb .t{flex:1}
.next{margin-top:14px;text-align:right}
/* Kropp */
.body-wrap{display:flex;justify-content:center;margin-top:6px}
.body-wrap svg{width:min(240px,60vw);height:auto}
.spot{cursor:pointer}
.spot circle.ring{fill:#c9673f33;stroke:var(--accent);stroke-width:3;animation:pulse 1.6s infinite}
.spot.right circle.ring{fill:#4f7a4a55;stroke:var(--green);animation:none}
.spot.wrong circle.ring{fill:#b5533c44;stroke:var(--red);animation:none}
@keyframes pulse{50%{stroke-width:6}}
/* Besök-intro */
.visit{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.visit img{width:150px;height:150px;border-radius:16px;object-fit:cover}
.visit div{flex:1;min-width:220px}
.visit h2{margin:0 0 6px}
/* Rapport */
.nurse{display:flex;gap:14px;align-items:center}
.nurse img{width:110px;height:110px;border-radius:14px;object-fit:cover;flex:none}
.check{display:flex;gap:12px;align-items:center}
.check .box{width:30px;height:30px;border-radius:8px;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-weight:900}
.opt.sel{border-color:var(--accent)}
.opt.sel .box{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.picked .box{background:var(--soft);border-color:var(--soft);color:#fff}
.opt.right.done{border-color:var(--green);background:var(--green-bg)}
.opt.right.picked .box{background:var(--green);border-color:var(--green)}
.opt.wrong.done{border-color:var(--red);background:var(--red-bg);opacity:1}
.opt.wrong.picked .box{background:var(--red);border-color:var(--red)}
.opt .why{display:block;font-size:16px;font-weight:400;margin-top:6px;color:var(--ink)}
/* Slut */
.stars{font-size:46px;letter-spacing:6px;margin:8px 0}
.words{width:100%;border-collapse:collapse;margin-top:10px;font-size:17px}
.words td{padding:8px 6px;border-bottom:1px solid var(--line)}
.words td:last-child{width:52px;text-align:right}
/* Lärarläge */
.lararknappar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.lararknappar .btn{min-height:46px;padding:10px 20px;font-size:17px}
.temarad{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lank{color:var(--accent);font-weight:700;font-size:16px;text-decoration:underline;min-height:44px}
.opt.off{opacity:.45;cursor:default}
.opt.check.sel .why{color:var(--ink)}
.lararfot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;margin-top:12px;border-top:2px solid var(--line)}
#summa{font-weight:700}
#lanken{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:2px solid var(--line);font:inherit;font-size:15px;background:#fff;color:var(--ink)}
@media (max-width:560px){
  body{font-size:17px}
  .grid{gap:8px}
  .opt{padding:6px}
  .opt .lbl{font-size:15px}
  .say .txt{font-size:19px}
  .patient{width:34%}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==========================================================
   INNEHÅLL – ändra här, inte i motorn längre ner.

   Ett FALL är en liten situation hos en brukare: 1–3 uppgifter
   och ev. en rad till rapporten. Spelet slumpar fall till ett pass.

   Platshållare i texter: {namn} {hen} {Hen} {henne} {hens}
   Uppgiftstyper: hamta (välj föremål), forsta (vad menar brukaren),
                  handla (vad gör du), visa (peka på kroppsdel, ratt: "kna" osv.)
   tema: hjalpmedel | symtom | kropp | ansvar | hygien
   krav: { kon: "man" } om fallet bara passar vissa brukare
   rapport: { text, ratt: true } = ska rapporteras
            { text, ratt: false } = prioriteringsfälla (dokumentera)
   ========================================================== */
const SPEL = {
  titel: "Ett pass",
  undertitel: "Hemtjänsten",
  intro: "Du jobbar i hemtjänsten i dag. Du ska besöka tre personer. Lyssna noga och hjälp dem.",
  sjukskoterska: { namn: "Lena", bild: "sjukskoterska" },
  uppgifterPerPass: 12,
  maxRapport: 4          // högst så många saker att rapportera i ett slumpat pass
};

const BRUKARE = [
  { id: "karin", namn: "Karin", kon: "kvinna", intro: "Karin är 84 år och bor ensam i en lägenhet." },
  { id: "ahmed", namn: "Ahmed", kon: "man", intro: "Ahmed är 78 år och bor i ett radhus." },
  { id: "gunnar", namn: "Gunnar", kon: "man", intro: "Gunnar är 91 år och bor ensam i ett gammalt hus." }
];

const TEMAN = { hjalpmedel: "Hjälpmedel", symtom: "Symtom", kropp: "Kroppen", ansvar: "Handling och ansvar", hygien: "Hygien" };

const FALL = [
  /* ---------- Hjälpmedel ---------- */
  { id: "stodstrumpor", titel: "Stödstrumpor", tema: "hjalpmedel",
    uppgifter: [
      { typ: "hamta", rum: "sovrum", hor: "{namn} ska ha sina stödstrumpor på sig.", fraga: "Vad ska du ta fram?",
        alternativ: [
          { ikon: "stodstrumpor", text: "Stödstrumpor", ratt: true, forklaring: "Rätt! Stödstrumpor är långa och sitter hårt runt benen. De hjälper blodet att gå tillbaka till hjärtat." },
          { ikon: "tofflor", text: "Tofflor", forklaring: "Det där är tofflor. Man har dem på fötterna inomhus. Stödstrumpor är långa och sitter hårt runt benen." },
          { ikon: "sockor", text: "Sockor", forklaring: "Det där är vanliga sockor. Stödstrumpor är längre och sitter hårt runt benen." } ] } ] },

  { id: "rollator", titel: "Rollator", tema: "hjalpmedel",
    uppgifter: [
      { typ: "hamta", rum: "vardagsrum", hor: "{namn} vill gå till köket. Hämta {hens} rollator.", fraga: "Vad ska du hämta?",
        alternativ: [
          { ikon: "rollator", text: "Rollator", ratt: true, forklaring: "Rätt! En rollator har hjul och handtag. Man går med den och kan vila på sitsen." },
          { ikon: "rullstol", text: "Rullstol", forklaring: "Det där är en rullstol. Man sitter i den. {namn} vill gå själv." },
          { ikon: "kryckor", text: "Kryckor", forklaring: "Det där är kryckor. En rollator har hjul." } ] } ] },

  { id: "duschstol", titel: "Duschstol", tema: "hjalpmedel",
    uppgifter: [
      { typ: "hamta", rum: "badrum", hor: "{namn} ska duscha. {Hen} behöver sitta.", fraga: "Vad ska {hen} sitta på?",
        alternativ: [
          { ikon: "duschstol", text: "Duschstol", ratt: true, forklaring: "Rätt! På en duschstol kan man sitta och duscha säkert. Den har ryggstöd, armstöd och gummifötter som inte glider." },
          { ikon: "nattstol", text: "Nattstol", forklaring: "Det där är en nattstol. Den står vid sängen och man kan kissa i den på natten." },
          { ikon: "koksstol", text: "Köksstol", forklaring: "En vanlig köksstol kan glida på det våta golvet. Den är inte säker i duschen." } ] } ] },

  { id: "urinflaska", titel: "Urinflaska", tema: "hjalpmedel", krav: { kon: "man" },
    uppgifter: [
      { typ: "hamta", rum: "sovrum", hor: "{namn} behöver kissa i natt.", fraga: "Vad ställer du fram vid sängen?",
        alternativ: [
          { ikon: "urinflaska", text: "Urinflaska", ratt: true, forklaring: "Rätt! I en urinflaska kan man kissa, till exempel i sängen på natten." },
          { ikon: "backen", text: "Bäcken", forklaring: "Det där är ett bäcken. Man använder det när man ligger i sängen och inte kan resa sig. {namn} kan använda urinflaska." },
          { ikon: "hink", text: "Hink", forklaring: "En hink är inget hjälpmedel. Den är inte gjord för att kissa i." } ] } ] },

  { id: "horapparat", titel: "Hörapparat", tema: "hjalpmedel",
    uppgifter: [
      { typ: "hamta", rum: "vardagsrum", hor: "{namn} hör dåligt i dag.", fraga: "Vad behöver {hen}?",
        alternativ: [
          { ikon: "horapparat", text: "Hörapparat", ratt: true, forklaring: "Rätt! En hörapparat sitter vid örat och hjälper {namn} att höra." },
          { ikon: "glasogon", text: "Glasögon", forklaring: "Glasögon hjälper när man ser dåligt. {namn} hör dåligt." },
          { ikon: "tandprotes", text: "Tandprotes", forklaring: "En tandprotes är löständer. Man behöver dem för att tugga. {namn} hör dåligt." } ] } ] },

  { id: "tandprotes", titel: "Löständer", tema: "hjalpmedel",
    uppgifter: [
      { typ: "hamta", rum: "kok", hor: "{namn} ska äta frukost. {Hen} behöver sina löständer.", fraga: "Vad ska du hämta?",
        alternativ: [
          { ikon: "tandprotes", text: "Tandprotes", ratt: true, forklaring: "Rätt! Löständer heter tandprotes. Man behöver dem för att tugga maten." },
          { ikon: "horapparat", text: "Hörapparat", forklaring: "En hörapparat hjälper när man hör dåligt. {namn} behöver sina löständer." },
          { ikon: "glasogon", text: "Glasögon", forklaring: "Glasögon hjälper när man ser dåligt. {namn} behöver sina löständer." } ] } ] },

  { id: "trygghetslarm", titel: "Trygghetslarm", tema: "hjalpmedel",
    uppgifter: [
      { typ: "hamta", rum: "badrum", hor: "{namn} ska duscha. {Hen} måste ha sitt larm på sig.", fraga: "Vad ska {hen} ha på armen?",
        alternativ: [
          { ikon: "trygghetslarm", text: "Trygghets\u00ADlarm", ratt: true, forklaring: "Rätt! Med trygghetslarmet kan {namn} larma om {hen} ramlar." },
          { ikon: "klocka", text: "Armbands\u00ADklocka", forklaring: "En klocka visar tiden. Den kan inte larma." },
          { ikon: "nyckel", text: "Nyckel", forklaring: "Det där är en nyckel. Den kan inte larma." } ] } ] },

  { id: "skydd", titel: "Byta skydd", tema: "hygien",
    uppgifter: [
      { typ: "hamta", rum: "badrum", hor: "{namn} behöver byta sitt skydd.", fraga: "Vad ska du ta fram?",
        alternativ: [
          { ikon: "inkontinensskydd", text: "Inkontinens\u00ADskydd", ratt: true, forklaring: "Rätt! Ett inkontinensskydd tar upp urin. Man säger ofta bara ”skydd”." },
          { ikon: "handduk", text: "Handduk", forklaring: "En handduk torkar man sig med efter tvätt. Den är inget skydd." },
          { ikon: "tvattlapp", text: "Tvättlapp", forklaring: "En tvättlapp tvättar man huden med. Den är inget skydd." } ] } ] },

  /* ---------- Symtom ---------- */
  { id: "yrsel", titel: "Yrsel vid uppresning", tema: "symtom",
    uppgifter: [
      { typ: "forsta", rum: "sovrum", humor: "ont", sager: "Det snurrar i huvudet när jag reser mig.", fraga: "Vad menar {namn}?",
        alternativ: [
          { text: "Yrsel", fack: "vertigo", ratt: true, forklaring: "Rätt! ”Det snurrar i huvudet” betyder att {namn} är yr. Fackordet är vertigo." },
          { text: "Huvudvärk", fack: "cefalgi", forklaring: "Huvudvärk betyder att det gör ont i huvudet. {namn} säger att det snurrar." },
          { text: "Illamående", fack: "nausea", forklaring: "Illamående betyder att man mår illa, som om man ska kräkas. {namn} säger att det snurrar." } ] },
      { typ: "handla", rum: "sovrum", humor: "ont", hor: "{namn} är yr när {hen} reser sig.", fraga: "Vad gör du?",
        alternativ: [
          { text: "Låter {henne} sitta en stund innan {hen} reser sig", ratt: true, forklaring: "Rätt! Om man reser sig för snabbt kan man bli yr och ramla. {namn} får sitta kvar en stund först." },
          { text: "Hjälper {henne} snabbt upp", forklaring: "Nej. Om {namn} reser sig snabbt kan {hen} bli mer yr och ramla. Det är fallrisk." },
          { text: "Ger {henne} en tablett", forklaring: "Nej. Du får bara ge läkemedel enligt ordination. Berätta för sjuksköterskan i stället." } ] } ],
    rapport: { text: "{namn} blir yr när {hen} reser sig", ratt: true, forklaring: "Ja. Yrsel kan leda till fall. Sjuksköterskan behöver veta det." } },

  { id: "aptit", titel: "Dålig aptit", tema: "symtom",
    uppgifter: [
      { typ: "forsta", rum: "kok", sager: "Jag orkar inte äta, jag är inte hungrig.", fraga: "Vad menar {namn}?",
        alternativ: [
          { text: "Dålig aptit", fack: "inappetens", ratt: true, forklaring: "Rätt! ”Jag är inte hungrig” betyder dålig aptit. Fackordet är inappetens." },
          { text: "Illamående", fack: "nausea", forklaring: "Illamående betyder att man mår illa. {namn} säger att {hen} inte är hungrig." },
          { text: "Magont", fack: "buksmärta", forklaring: "Magont betyder att det gör ont i magen. {namn} säger att {hen} inte är hungrig." } ] } ],
    rapport: { text: "{namn} ville inte äta frukost", ratt: false, forklaring: "Bra att du märkte det! Skriv det i dokumentationen. Det är inte lika bråttom som det andra." } },

  { id: "feber", titel: "Feber", tema: "symtom",
    uppgifter: [
      { typ: "forsta", rum: "vardagsrum", humor: "ont", sager: "Jag fryser och svettas samtidigt.", fraga: "Vad kan det vara?",
        alternativ: [
          { text: "Feber", fack: "febril", ratt: true, forklaring: "Rätt! Att frysa och svettas samtidigt kan betyda feber. Man säger att {namn} kan vara febril." },
          { text: "Trötthet", fack: "fatigue", forklaring: "Trött betyder att man vill sova eller vila. {namn} fryser och svettas." },
          { text: "Förkylning", fack: "", forklaring: "Förkyld betyder att man har snuva och hosta. Att frysa och svettas kan vara feber." } ] },
      { typ: "handla", rum: "vardagsrum", humor: "ont", hor: "{namn} kan ha feber.", fraga: "Vad gör du?",
        alternativ: [
          { text: "Mäter temperaturen", ratt: true, forklaring: "Rätt! Mät temperaturen först. Sedan rapporterar du till sjuksköterskan." },
          { text: "Ger {henne} Alvedon själv", forklaring: "Nej. Du får inte ge läkemedel på eget initiativ. Läkemedel ges bara enligt ordination." },
          { text: "Öppnar fönstret", forklaring: "Nej. Det hjälper inte {namn}. Mät temperaturen först." } ] } ],
    rapport: { text: "{namn} har feber", ratt: true, forklaring: "Ja. Feber kan vara tecken på en infektion. Sjuksköterskan behöver veta det." } },

  { id: "sveda", titel: "Sveda vid kissning", tema: "symtom",
    uppgifter: [
      { typ: "forsta", rum: "badrum", humor: "ont", sager: "Det bränner när jag kissar.", fraga: "Vad menar {namn}?",
        alternativ: [
          { text: "Sveda vid kissning", fack: "dysuri", ratt: true, forklaring: "Rätt! ”Det bränner” betyder att det svider. Sveda vid kissning heter dysuri. Det kan vara en urinvägsinfektion." },
          { text: "Behöver kissa ofta", fack: "pollakisuri", forklaring: "Det betyder att man måste gå på toaletten många gånger. {namn} säger att det bränner när {hen} kissar." },
          { text: "Läcker urin", fack: "inkontinens", forklaring: "Det betyder att man inte kan hålla tätt, att det kommer kiss utan att man vill. {namn} säger att det bränner." } ] } ],
    rapport: { text: "Det bränner när {namn} kissar", ratt: true, forklaring: "Ja. Sveda vid kissning kan vara en urinvägsinfektion." } },

  { id: "forstoppning", titel: "Förstoppning", tema: "symtom",
    uppgifter: [
      { typ: "forsta", rum: "kok", humor: "ont", sager: "Jag har inte bajsat på fyra dagar.", fraga: "Vad menar {namn}?",
        alternativ: [
          { text: "Förstoppning", fack: "obstipation", ratt: true, forklaring: "Rätt! Att inte bajsa på flera dagar heter förstoppning. Fackordet är obstipation." },
          { text: "Diarré", fack: "", forklaring: "Diarré betyder lös och vattnig avföring, ofta många gånger. {namn} har inte bajsat alls." },
          { text: "Illamående", fack: "nausea", forklaring: "Illamående betyder att man mår illa. {namn} har inte bajsat på fyra dagar." } ] } ],
    rapport: { text: "{namn} har inte bajsat på fyra dagar", ratt: true, forklaring: "Ja. Förstoppning kan ge ont och göra en äldre person förvirrad." } },

  { id: "andfadd", titel: "Andfådd", tema: "symtom",
    uppgifter: [
      { typ: "forsta", rum: "vardagsrum", humor: "ont", sager: "Jag får inte luft när jag går till köket.", fraga: "Vad menar {namn}?",

/* Bygger ett pass: tre brukare, fall fördelade på dem, rapport av det som hände */
function byggPass(lararFall) {
  const brukare = shuffle(BRUKARE).slice(0, 3).map(b => ({ b, fall: [], n: 0 }));
  const pool = shuffle(lararFall || FALL.filter(spelbart));
  const mal = lararFall ? Infinity : SPEL.uppgifterPerPass;
  let total = 0, rapportFall = 0;
  for (const f of pool) {
    if (total >= mal) break;
    const rapporteras = f.rapport && f.rapport.ratt;
    if (!lararFall && rapporteras && rapportFall >= SPEL.maxRapport) continue;
    const kandidater = shuffle(brukare.filter(s => passar(f, s.b))).sort((x, y) => x.n - y.n);
    if (!kandidater.length) continue;
    const s = kandidater[0];
    s.fall.push(f); s.n += f.uppgifter.length; total += f.uppgifter.length;
    if (rapporteras) rapportFall++;
  }
  const besok = brukare.filter(s => s.fall.length).map(s => ({
    b: s.b,
    uppgifter: shuffle(s.fall).flatMap(f => f.uppgifter.map(u => ({ u, f })))
  }));
  /* Rapport */
  const ratt = [], fallor = [];
  brukare.forEach(s => s.fall.forEach(f => {
    if (!f.rapport) return;
    const rad = { text: fyll(f.rapport.text, s.b), ratt: !!f.rapport.ratt, forklaring: fyll(f.rapport.forklaring, s.b) };
    (rad.ratt ? ratt : fallor).push(rad);
  }));
  const rader = [...ratt, ...fallor];
  const fyllnad = shuffle(RAPPORT_UTFYLLNAD);
  let i = 0;
  while (ratt.length && rader.length < Math.max(ratt.length + 3, 6) && i < fyllnad.length) {
    const b = besok[i % besok.length].b;
    rader.push({ text: fyll(fyllnad[i].text, b), ratt: false, forklaring: fyll(fyllnad[i].forklaring, b) });
    i++;
  }
  return { besok, rapport: ratt.length ? { rader: shuffle(rader), antal: ratt.length } : null };
}

function nyttPass() {
  st = { pass: byggPass(valdaFallFranLank()), b: 0, u: -1, poang: 0, klara: 0, ord: [] };
}
const antalUppgifter = () => st.pass.besok.reduce((n, v) => n + v.uppgifter.length, 0);

function toppRad() {
  const tot = antalUppgifter() + (st.pass.rapport ? 1 : 0);
  const pct = Math.round((st.klara / tot) * 100);
  return `<div class="top"><div class="progress" aria-label="Framsteg"><i style="width:${pct}%"></i></div>
    <button class="icon-btn" id="ljudknapp" aria-label="Ljud av/på">${ljud ? "🔊" : "🔇"}</button></div>`;
}

function visa(html) {
  app.innerHTML = html;
  app.querySelectorAll("[data-tala]").forEach(b => b.onclick = () => tala(b.dataset.tala));
  const lk = document.getElementById("ljudknapp");
  if (lk) lk.onclick = () => {
    ljud = !ljud; try { localStorage.setItem("ettpass_ljud", ljud ? "pa" : "av"); } catch (e) {}
    if (!ljud && "speechSynthesis" in window) speechSynthesis.cancel();
    lk.textContent = ljud ? "🔊" : "🔇";
  };
  window.scrollTo(0, 0);
}

/* --- Start --- */
function startSkarm() {
  if (LARARE) { lararSkarm(); return; }
  let basta = null;
  try { basta = localStorage.getItem("ettpass_basta2"); } catch (e) {}
  const lf = valdaFallFranLank();
  visa(`<div class="hero" style="background-image:url(${img("startbild")})">
      <h1>${SPEL.titel}</h1><p>${SPEL.undertitel}</p></div>
    <div class="center">
      <p class="lead">${SPEL.intro}</p>
      ${lf ? `<p class="small">Din lärare har valt ${lf.length} situationer till det här passet.</p>` : ""}
      <button class="btn" id="go">Starta passet</button>
      <p class="small">Tips: sätt på ljudet. Allt läses upp.${basta ? `<br>Ditt bästa resultat: ${basta} rätt` : ""}</p>
      <p class="small"><a href="../" style="color:var(--soft)">← Alla spel</a></p>
    </div>`);
  document.getElementById("go").onclick = () => { nyttPass(); tala(SPEL.intro); besokIntro(); };
}

/* --- Besök --- */
function besokIntro() {
  const b = st.pass.besok[st.b].b;
  visa(`${toppRad()}
    <div class="panel"><div class="visit">
      <img src="${img(b.id + "_neutral")}" alt="${b.namn}">
      <div><h2>Besök ${st.b + 1}: ${b.namn}</h2><p>${b.intro}</p></div>
    </div>
    <div class="next"><button class="btn" id="go">Gå in</button></div></div>`);
  tala(`Besök ${st.b + 1}. ${b.intro}`);
  document.getElementById("go").onclick = () => { st.u = 0; uppdrag(); };
}

function uppdrag() {
  const v = st.pass.besok[st.b];
  const b = v.b;
  const u = v.uppgifter[st.u].u;
  const F = t => fyll(t, b);
  const humor = u.humor || "neutral";
  const sager = F(u.sager), hor = F(u.hor), fraga = F(u.fraga);
  const replik = sager ? `<div class="txt quote">${esc(sager)}</div>` : `<div class="txt">${esc(hor)}</div>`;
  const uppl = sager ? `${b.namn} säger: ${sager}` : hor;
  let alts;
  if (u.typ === "visa") {
    const r = DELAR[u.ratt];
    alts = Object.keys(DELAR).map(d => {
      const x = DELAR[d];
      return d === u.ratt
        ? { del: d, text: x.text, ratt: true, forklaring: `Rätt! Det där är ${x.best}. Den sitter ${x.var}.`.replace("Den sitter", d === "kna" ? "Det sitter" : "Den sitter") }
        : { del: d, text: x.text, forklaring: `Det där är ${x.best}. ${r.best[0].toUpperCase() + r.best.slice(1)} sitter ${r.var}.` };
    });
  } else {
    alts = shuffle(u.alternativ.map(a => ({ ...a, text: F(a.text), forklaring: F(a.forklaring) })));
  }
  let alternativHTML;
  if (u.typ === "hamta") {
    alternativHTML = `<div class="grid">${alts.map((a, i) => `<button class="opt" data-i="${i}">${ikon(a.ikon)}<span class="lbl hidden${a.text.length > 12 ? " lang" : ""}">${esc(a.text)}</span></button>`).join("")}</div>`;
  } else if (u.typ === "visa") {
    alternativHTML = `<div class="body-wrap">${kroppSVG(alts)}</div>`;
  } else {
    alternativHTML = `<div class="list">${alts.map((a, i) => `<button class="opt" data-i="${i}">${esc(a.text)}${u.typ === "forsta" && a.fack ? `<span class="fack">${esc(a.fack)}</span>` : ""}</button>`).join("")}</div>`;
  }
  visa(`${toppRad()}
    <div class="scene" style="background-image:url(${img("miljo_" + u.rum)})">
      <span class="room">${RUM[u.rum]}</span>
      <div class="patient" id="pat"><img src="${img(b.id + "_" + humor)}" alt="${b.namn}"><b>${b.namn}</b></div>
    </div>
    <div class="panel">
      <div class="say">${replik}${hogtalare(uppl + ". " + fraga)}</div>
      <div class="ask">${esc(fraga)}</div>
      ${alternativHTML}
      <div id="fb"></div>
    </div>`);
  tala(uppl + ". " + fraga);

  let forstaForsoket = true;
  const pat = document.getElementById("pat");
  const knappar = u.typ === "visa" ? app.querySelectorAll(".spot") : app.querySelectorAll(".opt");
  knappar.forEach(el => el.onclick = () => {
    if (el.classList.contains("done") || el.classList.contains("wrong")) return;
    const a = alts[+el.dataset.i];
    const fb = document.getElementById("fb");
    if (a.ratt) {
      el.classList.add("right");
      knappar.forEach(k => k.classList.add("done"));
      app.querySelectorAll(".lbl").forEach(l => l.classList.remove("hidden"));
      if (forstaForsoket) st.poang++;
      st.klara++;
      if (u.typ !== "handla") st.ord.push({ ord: a.text, fack: a.fack || "" });
      pat.querySelector("img").src = img(b.id + "_glad");
      pat.classList.remove("pop"); void pat.offsetWidth; pat.classList.add("pop");
      const sist = st.u === v.uppgifter.length - 1;
      fb.innerHTML = `<div class="fb ok"><div class="t">${esc(a.forklaring)}</div>${hogtalare(a.forklaring)}</div>
        <div class="next"><button class="btn" id="nasta">${sist ? "Klar här" : "Nästa"}</button></div>`;
      fb.querySelector("[data-tala]").onclick = () => tala(a.forklaring);
      tala(a.forklaring);
      document.getElementById("nasta").onclick = nasta;
      document.getElementById("nasta").scrollIntoView({ behavior: "smooth", block: "center" });
    } else {
      forstaForsoket = false;
      el.classList.add("wrong");
      const lbl = el.querySelector(".lbl"); if (lbl) lbl.classList.remove("hidden");
      fb.innerHTML = `<div class="fb no"><div class="t">${esc(a.forklaring)} <b>Försök igen!</b></div>${hogtalare(a.forklaring)}</div>`;
      fb.querySelector("[data-tala]").onclick = () => tala(a.forklaring);
      tala(a.forklaring + " Försök igen.");
    }
  });
}

function nasta() {
  const v = st.pass.besok[st.b];
  if (st.u < v.uppgifter.length - 1) { st.u++; uppdrag(); return; }
  if (st.b < st.pass.besok.length - 1) { st.b++; st.u = -1; besokIntro(); return; }
  if (st.pass.rapport) rapport(); else slut();
}

/* --- Rapport --- */
function rapport() {
  const r = st.pass.rapport, s = SPEL.sjukskoterska;
  const uppmaning = `Passet är snart slut. Ring sjuksköterskan ${s.namn}. Välj ${r.antal === 1 ? "det" : "de " + r.antal + " saker"} som hon måste få veta.`;
  const alts = r.rader;
  const valda = new Set();
  visa(`${toppRad()}
    <div class="panel">
      <div class="nurse"><img src="${img(s.bild)}" alt="Sjuksköterskan ${s.namn}">
        <div class="say" style="flex:1"><div class="txt">${esc(uppmaning)}</div>${hogtalare(uppmaning)}</div></div>
      <div class="list" id="rl">${alts.map((a, i) => `<button class="opt check" data-i="${i}"><span class="box"></span><span>${esc(a.text)}<span class="why" hidden></span></span></button>`).join("")}</div>
      <div class="next"><button class="btn" id="skicka" disabled>Rapportera (0 av ${r.antal})</button></div>
      <div id="fb"></div>
    </div>`);
  tala(uppmaning);
  const skicka = document.getElementById("skicka");
  app.querySelectorAll("#rl .opt").forEach(el => el.onclick = () => {
    if (el.classList.contains("done")) return;
    const i = +el.dataset.i;
    if (valda.has(i)) { valda.delete(i); el.classList.remove("sel"); el.querySelector(".box").textContent = ""; }
    else if (valda.size < r.antal) { valda.add(i); el.classList.add("sel"); el.querySelector(".box").textContent = "✓"; tala(alts[i].text); }
    skicka.disabled = valda.size !== r.antal;
    skicka.textContent = `Rapportera (${valda.size} av ${r.antal})`;
  });
  skicka.onclick = () => {
    let ratt = 0;
    app.querySelectorAll("#rl .opt").forEach(el => {
      const a = alts[+el.dataset.i], vald = valda.has(+el.dataset.i);
      el.classList.add("done"); el.classList.remove("sel");
      if (vald) el.classList.add("picked"); else if (a.ratt) el.querySelector(".box").textContent = "!";
      if (a.ratt && vald) { el.classList.add("right"); ratt++; }
      else if (a.ratt) el.classList.add("right");
      else if (vald) el.classList.add("wrong");
      if (a.ratt || vald) { const w = el.querySelector(".why"); w.textContent = a.forklaring; w.hidden = false; }
    });
    st.poang += ratt; st.klara++;
    const msg = ratt === r.antal ? `Bra rapport! ${s.namn} fick veta allt viktigt.` : `Du valde ${ratt} av ${r.antal} viktiga saker. Läs vad som var viktigast.`;
    skicka.remove();
    document.getElementById("fb").innerHTML = `<div class="fb ${ratt === r.antal ? "ok" : "no"}"><div class="t">${msg}</div></div>
      <div class="next"><button class="btn" id="slut">Avsluta passet</button></div>`;
    tala(msg);
    document.getElementById("slut").onclick = slut;
  };
}

/* --- Slut --- */
function slut() {
  const max = antalUppgifter() + (st.pass.rapport ? st.pass.rapport.antal : 0);
  const andel = st.poang / max;
  const stjarnor = andel >= .9 ? 3 : andel >= .6 ? 2 : 1;
  const procent = Math.round(andel * 100);
  try {
    const gammal = parseInt(localStorage.getItem("ettpass_basta2")) || 0;
    if (procent > gammal) localStorage.setItem("ettpass_basta2", procent + " %");
  } catch (e) {}
  const ord = st.ord.filter((o, i, a) => a.findIndex(x => x.ord === o.ord) === i);
  const text = stjarnor === 3 ? "Fantastiskt! Du har gjort ett jättebra pass." : stjarnor === 2 ? "Bra jobbat! Du klarade passet." : "Passet är klart. Spela igen så lär du dig mer!";
  visa(`${toppRad()}
    <div class="panel center" style="margin-top:0">
      <h2 style="margin:4px 0">Passet är slut!</h2>
      <div class="stars">${"★".repeat(stjarnor)}${"☆".repeat(3 - stjarnor)}</div>
      <p class="lead" style="margin:6px auto">${text}</p>
      <p>Rätt på första försöket: <b>${st.poang} av ${max}</b></p>
    </div>
    <div class="panel"><h3 style="margin:0 0 4px">Ord du har tränat på</h3>
      <table class="words">${ord.map(o => `<tr><td><b>${esc(o.ord)}</b>${o.fack ? `<br><span class="small">${esc(o.fack)}</span>` : ""}</td><td>${hogtalare(o.ord + (o.fack ? ", " + o.fack : ""))}</td></tr>`).join("")}</table>
    </div>
    <div class="center"><button class="btn" id="igen">Spela ett nytt pass</button></div>`);
  tala(text);
  document.getElementById("igen").onclick = () => { nyttPass(); besokIntro(); };
}

/* --- Lärarläge (öppnas med #larare i adressen) --- */
function lararSkarm() {
  const valda = new Set();
  const grupper = Object.keys(TEMAN).map(t => ({ t, fall: FALL.filter(f => f.tema === t) })).filter(g => g.fall.length);
  const rad = f => {
    const ok = spelbart(f);
    const n = f.uppgifter.length;
    const typer = [...new Set(f.uppgifter.map(u => ({ hamta: "hämta", forsta: "förstå", handla: "handla", visa: "visa" })[u.typ]))].join(", ");
    return `<button class="opt check${ok ? "" : " off"}" data-id="${f.id}" ${ok ? "" : "disabled"}>
      <span class="box"></span><span><b>${esc(f.titel)}</b>
      <span class="why">${n} ${n === 1 ? "uppgift" : "uppgifter"}: ${typer}${f.rapport ? (f.rapport.ratt ? " · rapporteras" : " · prioriteringsfälla") : ""}${f.krav && f.krav.kon ? " · bara " + (f.krav.kon === "man" ? "män" : "kvinnor") : ""}${ok ? "" : " · saknar bild"}</span></span></button>`;
  };
  visa(`<div class="panel" style="margin-top:0">
      <h2 style="margin:0 0 6px">Lärarläge</h2>
      <p style="margin:0">Välj situationer och kopiera länken. Eleverna som öppnar länken får ett pass med just de situationerna. Utan länk slumpar spelet ${SPEL.uppgifterPerPass} uppgifter ur hela banken.</p>
      <div class="lararknappar"><button class="btn ghost" id="alla">Markera alla</button><button class="btn ghost" id="inga">Avmarkera alla</button></div>
    </div>
    ${grupper.map(g => `<div class="panel"><div class="temarad"><h3 style="margin:0">${TEMAN[g.t]}</h3>
      <button class="lank" data-tema="${g.t}">Välj alla</button></div>
      <div class="list">${g.fall.map(rad).join("")}</div></div>`).join("")}
    <div class="lararfot"><div id="summa">Inga situationer valda</div>
      <input id="lanken" readonly placeholder="Länken visas här" aria-label="Länk till passet">
      <div class="lararknappar"><button class="btn" id="kopiera" disabled>Kopiera länk</button><button class="btn ghost" id="prova" disabled>Prova passet</button></div>
      <p class="small"><a href="../" style="color:var(--soft)">← Alla spel</a></p></div>`);
  const knappar = [...app.querySelectorAll(".opt[data-id]")];
  const uppdatera = () => {
    knappar.forEach(k => { const p = valda.has(k.dataset.id); k.classList.toggle("sel", p); k.querySelector(".box").textContent = p ? "✓" : ""; });
    const fall = FALL.filter(f => valda.has(f.id));
    const n = fall.reduce((s, f) => s + f.uppgifter.length, 0);
    document.getElementById("summa").textContent = fall.length ? `${fall.length} situationer, ${n} uppgifter` : "Inga situationer valda";
    const url = location.href.split("#")[0] + "#fall=" + fall.map(f => f.id).join(",");
    document.getElementById("lanken").value = fall.length ? url : "";
    document.getElementById("kopiera").disabled = document.getElementById("prova").disabled = !fall.length;
  };
  knappar.forEach(k => k.onclick = () => { const id = k.dataset.id; valda.has(id) ? valda.delete(id) : valda.add(id); uppdatera(); });
  app.querySelectorAll("[data-tema]").forEach(b => b.onclick = () => { FALL.filter(f => f.tema === b.dataset.tema && spelbart(f)).forEach(f => valda.add(f.id)); uppdatera(); });
  document.getElementById("alla").onclick = () => { FALL.filter(spelbart).forEach(f => valda.add(f.id)); uppdatera(); };
  document.getElementById("inga").onclick = () => { valda.clear(); uppdatera(); };
  document.getElementById("kopiera").onclick = async () => {
    const f = document.getElementById("lanken"), b = document.getElementById("kopiera");
    try { await navigator.clipboard.writeText(f.value); } catch (e) { f.select(); try { document.execCommand("copy"); } catch (e2) {} }
    b.textContent = "Kopierad!"; setTimeout(() => b.textContent = "Kopiera länk", 1500);
  };
  document.getElementById("prova").onclick = () => { location.href = document.getElementById("lanken").value; };
}

window.addEventListener("hashchange", () => location.reload());
startSkarm();
</script>
