<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ett pass – hemtjänsten</title>
<meta name="theme-color" content="#f3e3cf">
<style>
:root{
  --bg:#f3e3cf; --card:#fffaf3; --ink:#3f2620; --soft:#7a5a4e; --line:#e2cdb5;
  --green:#4f7a4a; --green-bg:#e3eedd; --red:#b5533c; --red-bg:#f6e0d9; --accent:#c9673f;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:900px;margin:0 auto;padding:12px 16px 32px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 26px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:19px;box-shadow:0 3px 0 #9c4d2d}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9c4d2d}
.btn:disabled{opacity:.4;box-shadow:none;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.progress{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.icon-btn{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 var(--line);flex:none}
/* Start */
.hero{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:#dfe8ee center/cover}
.hero h1{position:absolute;top:8%;left:0;right:0;text-align:center;margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:.5px;color:var(--ink);text-shadow:0 2px 0 #fff8}
.hero p{position:absolute;top:calc(8% + clamp(44px,10vw,80px));left:0;right:0;text-align:center;margin:0;font-size:clamp(16px,3vw,22px);color:var(--soft)}
.center{text-align:center;margin-top:20px}
.lead{font-size:20px;max-width:560px;margin:16px auto}
.small{font-size:15px;color:var(--soft)}
/* Scen */
.scene{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:#eee center/cover;transition:background-image .3s}
.room{position:absolute;top:10px;right:10px;background:#fffaf3e6;border-radius:99px;padding:4px 14px;font-size:15px;font-weight:600}
.patient{position:absolute;left:10px;bottom:10px;width:30%;max-width:210px;background:var(--card);border-radius:14px;padding:6px 6px 4px;box-shadow:0 4px 14px #0002;text-align:center}
.patient img{width:100%;aspect-ratio:1;border-radius:10px;display:block;object-fit:cover}
.patient b{display:block;font-size:16px;padding-top:2px}
.patient.pop img{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.06)}}
.panel{background:var(--card);border-radius:var(--radius);padding:16px;margin-top:12px;box-shadow:0 2px 0 var(--line)}
.say{display:flex;gap:12px;align-items:flex-start}
.say .txt{flex:1;font-size:21px;font-weight:600}
.say .txt.quote{font-style:italic}
.say .txt.quote::before{content:"”"}.say .txt.quote::after{content:"”"}
.ask{margin:12px 0 4px;color:var(--soft);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.list{display:grid;gap:10px;margin-top:10px}
.opt{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;min-height:56px;text-align:center;transition:border-color .2s,background .2s}
.opt:active{transform:scale(.98)}
.opt svg{width:100%;max-width:120px;height:auto;display:block;margin:0 auto}
.opt img.hm{width:100%;max-width:170px;aspect-ratio:1;display:block;margin:0 auto;border-radius:10px}
.opt .lbl{display:block;font-weight:700;font-size:17px;min-height:1.4em}
.opt .lbl.hidden{visibility:hidden}
.opt .fack{display:block;font-size:14px;color:var(--soft);font-weight:400}
.list .opt{text-align:left;padding:12px 16px;font-size:19px;font-weight:600}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg);opacity:.75}
.opt.done{pointer-events:none}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;font-size:18px;display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:var(--green-bg)}.fb.no{background:var(--red-bg)}
.fb .t{flex:1}
.next{margin-top:14px;text-align:right}
/* Kropp */
.body-wrap{display:flex;justify-content:center;margin-top:6px}
.body-wrap svg{width:min(240px,60vw);height:auto}
.spot{cursor:pointer}
.spot circle.ring{fill:#c9673f33;stroke:var(--accent);stroke-width:3;animation:pulse 1.6s infinite}
.spot.right circle.ring{fill:#4f7a4a55;stroke:var(--green);animation:none}
.spot.wrong circle.ring{fill:#b5533c44;stroke:var(--red);animation:none}
@keyframes pulse{50%{stroke-width:6}}
/* Besök-intro */
.visit{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.visit img{width:150px;height:150px;border-radius:16px;object-fit:cover}
.visit div{flex:1;min-width:220px}
.visit h2{margin:0 0 6px}
/* Rapport */
.nurse{display:flex;gap:14px;align-items:center}
.nurse img{width:110px;height:110px;border-radius:14px;object-fit:cover;flex:none}
.check{display:flex;gap:12px;align-items:center}
.check .box{width:30px;height:30px;border-radius:8px;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-weight:900}
.opt.sel{border-color:var(--accent)}
.opt.sel .box{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.picked .box{background:var(--soft);border-color:var(--soft);color:#fff}
.opt.right.done{border-color:var(--green);background:var(--green-bg)}
.opt.right.picked .box{background:var(--green);border-color:var(--green)}
.opt.wrong.done{border-color:var(--red);background:var(--red-bg);opacity:1}
.opt.wrong.picked .box{background:var(--red);border-color:var(--red)}
.opt .why{display:block;font-size:16px;font-weight:400;margin-top:6px;color:var(--ink)}
/* Slut */
.stars{font-size:46px;letter-spacing:6px;margin:8px 0}
.words{width:100%;border-collapse:collapse;margin-top:10px;font-size:17px}
.words td{padding:8px 6px;border-bottom:1px solid var(--line)}
.words td:last-child{width:52px;text-align:right}
@media (max-width:560px){
  body{font-size:17px}
  .grid{gap:8px}
  .opt{padding:6px}
  .opt .lbl{font-size:15px}
  .say .txt{font-size:19px}
  .patient{width:34%}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==========================================================
   INNEHÅLL – ändra här, inte i motorn längre ner.
   Typer: hamta (välj föremål), forsta (vad menar brukaren),
          handla (vad gör du), visa (peka på kroppsdel)
   ========================================================== */
const PASS = {
  titel: "Ett pass",
  undertitel: "Hemtjänsten",
  intro: "Du jobbar i hemtjänsten i dag. Du ska besöka tre personer. Lyssna noga och hjälp dem.",
  sjukskoterska: { namn: "Lena", bild: "sjukskoterska" },
  brukare: [
    {
      id: "karin", namn: "Karin", intro: "Karin är 84 år och bor ensam. Du kommer på morgonbesök.",
      uppdrag: [
        { typ: "hamta", rum: "sovrum", hor: "Karin ska ha sina stödstrumpor på sig.", fraga: "Vad ska du ta fram?",

            { ikon: "tofflor", text: "Tofflor", forklaring: "Det där är tofflor. Man har dem på fötterna inomhus. Stödstrumpor är långa och sitter hårt runt benen." },

        { typ: "forsta", rum: "sovrum", humor: "ont", sager: "Det snurrar i huvudet när jag reser mig.", fraga: "Vad menar Karin?",
          alternativ: [
            { text: "Yrsel", fack: "vertigo", ratt: true, forklaring: "Rätt! ”Det snurrar i huvudet” betyder att Karin är yr. Fackordet är vertigo." },
            { text: "Huvudvärk", fack: "cefalgi", forklaring: "Huvudvärk betyder att det gör ont i huvudet. Karin säger att det snurrar." },
            { text: "Illamående", fack: "nausea", forklaring: "Illamående betyder att man mår illa, som om man ska kräkas. Karin säger att det snurrar." } ] },
        { typ: "handla", rum: "sovrum", humor: "ont", hor: "Karin är yr när hon reser sig.", fraga: "Vad gör du?",
          alternativ: [
            { text: "Låter henne sitta en stund innan hon reser sig", ratt: true, forklaring: "Rätt! Om man reser sig för snabbt kan man bli yr och ramla. Karin får sitta kvar en stund först." },
            { text: "Hjälper henne snabbt upp", forklaring: "Nej. Om Karin reser sig snabbt kan hon bli mer yr och ramla. Det är fallrisk." },
            { text: "Ger henne en tablett", forklaring: "Nej. Du får bara ge läkemedel enligt ordination. Berätta för sjuksköterskan i stället." } ] },
        { typ: "forsta", rum: "kok", humor: "neutral", sager: "Jag orkar inte äta, jag är inte hungrig.", fraga: "Vad menar Karin?",

            { text: "Dålig aptit", fack: "inappetens", ratt: true, forklaring: "Rätt! ”Jag är inte hungrig” betyder dålig aptit. Fackordet är inappetens." },
            { text: "Illamående", fack: "nausea", forklaring: "Illamående betyder att man mår illa. Karin säger att hon inte är hungrig." },

    {

            { ikon: "kryckor", text: "Kryckor", forklaring: "Det där är kryckor. Ahmed går med rollator, den har hjul." } ] },

        { typ: "forsta", rum: "kok", humor: "ont", sager: "Jag har inte bajsat på fyra dagar.", fraga: "Vad menar Gunnar?",
          alternativ: [
            { text: "Förstoppning", fack: "obstipation", ratt: true, forklaring: "Rätt! Att inte bajsa på flera dagar heter förstoppning. Fackordet är obstipation." },
            { text: "Diarré", fack: "", forklaring: "Diarré betyder lös och vattnig avföring, ofta många gånger. Gunnar har inte bajsat alls." },

    uppmaning: "Passet är snart slut. Ring sjuksköterskan Lena. Välj tre saker som hon måste få veta.",

};
/* Föremål med egen bild i bilder/hm_<namn>.webp. Saknas namnet här används SVG-ikonen ovan. */
const HM_BILDER = ["backen", "duschpall", "hink", "kryckor", "nattstol", "rollator", "rullstol", "sockor", "stodstrumpor", "tofflor", "urinflaska", "koksstol"];
const ikon = n => HM_BILDER.includes(n)
  ? `<img class="hm" src="bilder/hm_${n}.webp" alt="" draggable="false">`
  : `<svg viewBox="0 0 100 100" aria-hidden="true">${IKON[n] || ""}</svg>`;

/* Kroppsfigur för typ "visa" – punkter på höger ben (från betraktaren) */
const KROPP_PUNKTER = { hoft: [124, 162], kna: [115, 236], fotled: [114, 296] };
function kroppSVG(alts) {
  const spots = alts.map((a, i) => {
    const [x, y] = KROPP_PUNKTER[a.del];
    return `<g class="spot" data-i="${i}" role="button" aria-label="Punkt ${i + 1}"><circle cx="${x}" cy="${y}" r="26" fill="transparent" stroke="none"/><circle class="ring" cx="${x}" cy="${y}" r="13"/></g>`;
  }).join("");
  return `<svg viewBox="0 0 200 330" ${S}>
    <g fill="#f2c2a0" stroke="#5a3428" stroke-width="3">
      <circle cx="100" cy="34" r="22"/>
      <path d="M86 54h28l3 10H83z"/>
      <path d="M70 66c0-6 6-10 14-10h32c8 0 14 4 14 10v80H70z" fill="#7d97b0"/>
      <path d="M70 70l-18 64M130 70l18 64" fill="none" stroke-width="12" stroke="#7d97b0"/>
      <circle cx="50" cy="140" r="7"/><circle cx="150" cy="140" r="7"/>
      <path d="M72 146h56l2 26H70z" fill="#5f6f7e"/>
      <path d="M72 168h26l-2 132H80z" fill="#5f6f7e"/>
      <path d="M102 168h26l-4 132h-20z" fill="#5f6f7e"/>
      <path d="M80 300h16v10H70c0-6 4-10 10-10zM104 300h16c6 0 10 4 10 10h-26z" fill="#7a5a4e"/>
    </g>${spots}</svg>`;
}

/* ==========================================================
   MOTOR
   ========================================================== */
const app = document.getElementById("app");
const img = n => `bilder/${n}.webp`;
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let ljud = true;
try { ljud = localStorage.getItem("ettpass_ljud") !== "av"; } catch (e) {}
let rost = null;
function hittaRost() {
  if (!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices();
  rost = v.find(x => /^sv/i.test(x.lang) && /google/i.test(x.name)) || v.find(x => /^sv/i.test(x.lang)) || null;
}
if ("speechSynthesis" in window) { hittaRost(); speechSynthesis.onvoiceschanged = hittaRost; }
function tala(text) {
  if (!ljud || !("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[”"]/g, ""));
  u.lang = "sv-SE"; if (rost) u.voice = rost; u.rate = 0.9;
  speechSynthesis.speak(u);
}
const hogtalare = t => `<button class="icon-btn" data-tala="${esc(t)}" aria-label="Lyssna">🔊</button>`;

/* Tillstånd */
let st;
const allaUppdrag = () => PASS.brukare.reduce((n, b) => n + b.uppdrag.length, 0);
function nyttPass() { st = { b: 0, u: -1, poang: 0, klara: 0, forsok: 0, ord: [] }; }

function toppRad() {
  const tot = allaUppdrag() + 1;
  const pct = Math.round((st.klara / tot) * 100);
  return `<div class="top"><div class="progress" aria-label="Framsteg"><i style="width:${pct}%"></i></div>
    <button class="icon-btn" id="ljudknapp" aria-label="Ljud av/på">${ljud ? "🔊" : "🔇"}</button></div>`;
}

function visa(html) {
  app.innerHTML = html;
  app.querySelectorAll("[data-tala]").forEach(b => b.onclick = () => tala(b.dataset.tala));
  const lk = document.getElementById("ljudknapp");
  if (lk) lk.onclick = () => {
    ljud = !ljud; try { localStorage.setItem("ettpass_ljud", ljud ? "pa" : "av"); } catch (e) {}
    if (!ljud && "speechSynthesis" in window) speechSynthesis.cancel();
    lk.textContent = ljud ? "🔊" : "🔇";
  };
  window.scrollTo(0, 0);
}

/* --- Start --- */
function startSkarm() {
  let basta = null;
  try { basta = localStorage.getItem("ettpass_basta"); } catch (e) {}
  visa(`<div class="hero" style="background-image:url(${img("startbild")})">
      <h1>${PASS.titel}</h1><p>${PASS.undertitel}</p></div>
    <div class="center">
      <p class="lead">${PASS.intro}</p>
      <button class="btn" id="go">Starta passet</button>
      <p class="small">Tips: sätt på ljudet. Allt läses upp.${basta ? `<br>Ditt bästa resultat: ${basta}` : ""}</p>
      <p class="small"><a href="../" style="color:var(--soft)">← Alla spel</a></p>
    </div>`);
  document.getElementById("go").onclick = () => { nyttPass(); tala(PASS.intro); besokIntro(); };
}

/* --- Besök --- */
function besokIntro() {
  const b = PASS.brukare[st.b];
  visa(`${toppRad()}
    <div class="panel"><div class="visit">
      <img src="${img(b.id + "_neutral")}" alt="${b.namn}">
      <div><h2>Besök ${st.b + 1}: ${b.namn}</h2><p>${b.intro}</p></div>
    </div>
    <div class="next"><button class="btn" id="go">Gå in</button></div></div>`);
  tala(`Besök ${st.b + 1}. ${b.intro}`);
  document.getElementById("go").onclick = () => { st.u = 0; uppdrag(); };
}

function uppdrag() {
  const b = PASS.brukare[st.b];
  const u = b.uppdrag[st.u];
  const humor = u.humor || "neutral";
  const replik = u.sager ? `<div class="txt quote">${esc(u.sager)}</div>` : `<div class="txt">${esc(u.hor)}</div>`;
  const uppl = u.sager ? `${b.namn} säger: ${u.sager}` : u.hor;
  const alts = shuffle(u.alternativ.map((a, i) => ({ ...a, _i: i })));
  let alternativHTML;
  if (u.typ === "hamta") {
    alternativHTML = `<div class="grid">${alts.map((a, i) => `<button class="opt" data-i="${i}">${ikon(a.ikon)}<span class="lbl hidden">${esc(a.text)}</span></button>`).join("")}</div>`;
  } else if (u.typ === "visa") {
    alternativHTML = `<div class="body-wrap">${kroppSVG(alts)}</div>`;
  } else {
    alternativHTML = `<div class="list">${alts.map((a, i) => `<button class="opt" data-i="${i}">${esc(a.text)}${u.typ === "forsta" && a.fack ? `<span class="fack">${esc(a.fack)}</span>` : ""}</button>`).join("")}</div>`;
  }
  visa(`${toppRad()}
    <div class="scene" style="background-image:url(${img("miljo_" + u.rum)})">
      <span class="room">${RUM[u.rum]}</span>
      <div class="patient" id="pat"><img src="${img(b.id + "_" + humor)}" alt="${b.namn}"><b>${b.namn}</b></div>
    </div>
    <div class="panel">
      <div class="say">${replik}${hogtalare(uppl + ". " + u.fraga)}</div>
      <div class="ask">${esc(u.fraga)}</div>
      ${alternativHTML}
      <div id="fb"></div>
    </div>`);
  tala(uppl + ". " + u.fraga);

  let forstaForsoket = true;
  const pat = document.getElementById("pat");
  const knappar = u.typ === "visa" ? app.querySelectorAll(".spot") : app.querySelectorAll(".opt");
  knappar.forEach(el => el.onclick = () => {
    if (el.classList.contains("done") || el.classList.contains("wrong")) return;
    const a = alts[+el.dataset.i];
    const fb = document.getElementById("fb");
    if (a.ratt) {
      el.classList.add("right");
      knappar.forEach(k => k.classList.add("done"));
      app.querySelectorAll(".lbl").forEach(l => l.classList.remove("hidden"));
      if (forstaForsoket) st.poang++;
      st.klara++;
      if (u.typ !== "handla") st.ord.push({ ord: a.text, fack: a.fack || "" });
      pat.querySelector("img").src = img(b.id + "_glad");
      pat.classList.remove("pop"); void pat.offsetWidth; pat.classList.add("pop");
      const sist = st.u === b.uppdrag.length - 1;
      fb.innerHTML = `<div class="fb ok"><div class="t">${esc(a.forklaring)}</div>${hogtalare(a.forklaring)}</div>
        <div class="next"><button class="btn" id="nasta">${sist ? "Klar här" : "Nästa"}</button></div>`;
      fb.querySelector("[data-tala]").onclick = () => tala(a.forklaring);
      tala(a.forklaring);
      document.getElementById("nasta").onclick = nasta;
      document.getElementById("nasta").scrollIntoView({ behavior: "smooth", block: "center" });
    } else {
      forstaForsoket = false;
      el.classList.add("wrong");
      const lbl = el.querySelector(".lbl"); if (lbl) lbl.classList.remove("hidden");
      fb.innerHTML = `<div class="fb no"><div class="t">${esc(a.forklaring)} <b>Försök igen!</b></div>${hogtalare(a.forklaring)}</div>`;
      fb.querySelector("[data-tala]").onclick = () => tala(a.forklaring);
      tala(a.forklaring + " Försök igen.");
    }
  });
}

function nasta() {
  const b = PASS.brukare[st.b];
  if (st.u < b.uppdrag.length - 1) { st.u++; uppdrag(); return; }
  if (st.b < PASS.brukare.length - 1) { st.b++; st.u = -1; besokIntro(); return; }
  rapport();
}

/* --- Rapport --- */
function rapport() {
  const r = PASS.rapport, s = PASS.sjukskoterska;
  const alts = shuffle(r.alternativ);
  const valda = new Set();
  visa(`${toppRad()}
    <div class="panel">
      <div class="nurse"><img src="${img(s.bild)}" alt="Sjuksköterskan ${s.namn}">
        <div class="say" style="flex:1"><div class="txt">${esc(r.uppmaning)}</div>${hogtalare(r.uppmaning)}</div></div>
      <div class="list" id="rl">${alts.map((a, i) => `<button class="opt check" data-i="${i}"><span class="box"></span><span>${esc(a.text)}<span class="why" hidden></span></span></button>`).join("")}</div>
      <div class="next"><button class="btn" id="skicka" disabled>Rapportera (0 av ${r.antal})</button></div>
      <div id="fb"></div>
    </div>`);
  tala(r.uppmaning);
  const skicka = document.getElementById("skicka");
  app.querySelectorAll("#rl .opt").forEach(el => el.onclick = () => {
    if (el.classList.contains("done")) return;
    const i = +el.dataset.i;
    if (valda.has(i)) { valda.delete(i); el.classList.remove("sel"); el.querySelector(".box").textContent = ""; }
    else if (valda.size < r.antal) { valda.add(i); el.classList.add("sel"); el.querySelector(".box").textContent = "✓"; tala(alts[i].text); }
    skicka.disabled = valda.size !== r.antal;
    skicka.textContent = `Rapportera (${valda.size} av ${r.antal})`;
  });
  skicka.onclick = () => {
    let ratt = 0;
    app.querySelectorAll("#rl .opt").forEach(el => {
      const a = alts[+el.dataset.i], vald = valda.has(+el.dataset.i);
      el.classList.add("done"); el.classList.remove("sel");
      if (vald) el.classList.add("picked"); else if (a.ratt) el.querySelector(".box").textContent = "!";
      if (a.ratt && vald) { el.classList.add("right"); ratt++; }
      else if (a.ratt) el.classList.add("right");
      else if (vald) el.classList.add("wrong");
      if (a.ratt || vald) { const w = el.querySelector(".why"); w.textContent = a.forklaring; w.hidden = false; }
    });
    st.poang += ratt; st.klara++;
    const msg = ratt === r.antal ? "Bra rapport! Lena fick veta allt viktigt." : `Du valde ${ratt} av ${r.antal} viktiga saker. Läs vad som var viktigast.`;
    skicka.remove();
    document.getElementById("fb").innerHTML = `<div class="fb ${ratt === r.antal ? "ok" : "no"}"><div class="t">${msg}</div></div>
      <div class="next"><button class="btn" id="slut">Avsluta passet</button></div>`;
    tala(msg);
    document.getElementById("slut").onclick = slut;
  };
}

/* --- Slut --- */
function slut() {
  const max = allaUppdrag() + PASS.rapport.antal;
  const andel = st.poang / max;
  const stjarnor = andel >= .9 ? 3 : andel >= .6 ? 2 : 1;
  const res = `${st.poang} av ${max}`;
  try {
    const gammal = localStorage.getItem("ettpass_basta");
    if (!gammal || parseInt(gammal) < st.poang) localStorage.setItem("ettpass_basta", res);
  } catch (e) {}
  const ord = st.ord.filter((o, i, a) => a.findIndex(x => x.ord === o.ord) === i);
  const text = stjarnor === 3 ? "Fantastiskt! Du har gjort ett jättebra pass." : stjarnor === 2 ? "Bra jobbat! Du klarade passet." : "Passet är klart. Spela igen så lär du dig mer!";
  visa(`${toppRad()}
    <div class="panel center" style="margin-top:0">
      <h2 style="margin:4px 0">Passet är slut!</h2>
      <div class="stars">${"★".repeat(stjarnor)}${"☆".repeat(3 - stjarnor)}</div>
      <p class="lead" style="margin:6px auto">${text}</p>
      <p>Rätt på första försöket: <b>${res}</b></p>
    </div>
    <div class="panel"><h3 style="margin:0 0 4px">Ord du har tränat på</h3>
      <table class="words">${ord.map(o => `<tr><td><b>${esc(o.ord)}</b>${o.fack ? `<br><span class="small">${esc(o.fack)}</span>` : ""}</td><td>${hogtalare(o.ord + (o.fack ? ", " + o.fack : ""))}</td></tr>`).join("")}</table>
    </div>
    <div class="center"><button class="btn" id="igen">Spela igen</button></div>`);
  tala(text);
  document.getElementById("igen").onclick = () => { nyttPass(); besokIntro(); };
}

startSkarm();
</script>
</body>
</html>
