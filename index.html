<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elevspel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: rubrik och en lista med spelkort, ett per rad på mobil och två bredvid varandra på större skärmar. */
:root{
  --bg:#f1f3f2; --surface:#ffffff; --ink:#1c2422; --muted:#5a6663; --line:#d5dcd9; --accent:#1f5f55;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a2220; --ink:#e7eeeb; --muted:#9fb0aa; --line:#2e3a36; --accent:#5fb3a3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a2220; --ink:#e7eeeb; --muted:#9fb0aa; --line:#2e3a36; --accent:#5fb3a3; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:1.0625rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 48px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,8vw,3.2rem);font-weight:800;line-height:1.05}
p{margin:0}
.lead{color:var(--muted);max-width:50ch;font-size:1.1rem}
.spel{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:18px}
.kort{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none}
.kort:hover{border-color:var(--accent)}
.kort:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.bild{aspect-ratio:16/9;max-width:100%;background:var(--line) center/cover no-repeat;display:grid;place-items:center}
.text{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.kort h2{font-size:1.5rem;font-weight:600}
.kort p{color:var(--muted)}
.tranar{font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.tranar b{color:var(--ink)}
.oppna{font-weight:700;color:var(--accent)}
.fot{font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <h1>Elevspel</h1>
    <p class="lead">Spel för att träna ord och begrepp i vård och omsorg. Välj ett spel.</p>
  </header>
  <div class="spel" id="spel"></div>
  <p class="fot">Inget konto behövs. Det du gör sparas bara i den här webbläsaren.</p>
</main>

<script>
/* ============================================================
   SPELEN – lägg till ett nytt spel genom att lägga till ett objekt här.
   mapp:   mappen i repot där spelet ligger
   bild:   bild i spelets mapp (valfritt). Utan bild visas ordexemplet.
   exempel: två eller tre ord som visas på kortet när det saknas bild
   ============================================================ */
const SPEL = [
  {
    mapp: "ett-pass",
    namn: "Ett pass",
    beskrivning: "Gör ett arbetspass i hemtjänsten eller på särskilt boende. Du får uppdrag, möter brukare och använder rätt ord och hjälpmedel.",
    tranar: "Vardagsord och fackord i omvårdnad",
    bild: "ett-pass/bilder/startbild.webp"
  },
  {
    mapp: "skillnaden",
    namn: "Skillnaden",
    beskrivning: "Ord som ligger nära varandra. Träna på att se skillnaden i tre lägen: sortera, fyll i och välj exemplet.",
    tranar: "Svårare fackord och begrepp",
    exempel: ["symtom", "tecken"]
  }
];

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("spel").innerHTML = SPEL.map(s => `
  <a class="kort" href="${esc(s.mapp)}/">
    ${s.bild
      ? `<div class="bild" style="background-image:url('${esc(s.bild)}')" role="img" aria-label=""></div>`
      : `<div class="bild" aria-hidden="true" style="background:var(--accent)">
           <span style="font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.4rem);color:var(--surface);text-align:center;line-height:1.15;padding:0 16px">
             ${(s.exempel||[s.namn]).map(esc).join(' <span style="opacity:.55;font-weight:600">eller</span> ')}</span></div>`}
    <div class="text">
      <h2>${esc(s.namn)}</h2>
      <p>${esc(s.beskrivning)}</p>
      <p class="tranar"><b>Tränar:</b> ${esc(s.tranar)}</p>
      <span class="oppna">Starta →</span>
    </div>
  </a>`).join("");
</script>
</body>
</html>
