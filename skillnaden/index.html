<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skillnaden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: en smal kolumn, en uppgift i taget. Skrubbgrönt med överstrykningsgult för det ord som ska bedömas. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#17231f; --muted:#56655f; --line:#cfdad5;
  --scrub:#1f5f55; --scrub-ink:#ffffff; --mark:#ffe27a; --mark-ink:#2a2300;
  --ok:#1d7a46; --ok-bg:#e1f3e8; --bad:#b03a2e; --bad-bg:#fbe5e2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#18231f; --ink:#e6eeea; --muted:#9db0a8; --line:#2c3b35;
  --scrub:#5fb3a3; --scrub-ink:#08201b; --mark:#6b5a12; --mark-ink:#fff4c4;
  --ok:#6fd39a; --ok-bg:#163526; --bad:#f08b80; --bad-bg:#3a1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#18231f; --ink:#e6eeea; --muted:#9db0a8; --line:#2c3b35;
  --scrub:#5fb3a3; --scrub-ink:#08201b; --mark:#6b5a12; --mark-ink:#fff4c4;
  --ok:#6fd39a; --ok-bg:#163526; --bad:#f08b80; --bad-bg:#3a1c19; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:1.0625rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,8vw,2.75rem);font-weight:800;color:var(--scrub)}
h2{font-size:1.35rem;font-weight:600}
p{margin:0}
.lead{color:var(--muted);max-width:52ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}

/* Meny */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:5px}
.tab{background:none;border:none;border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.tab .n{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tab .t{font-family:var(--display);font-weight:600;font-size:1rem;text-align:center}
.tab[aria-selected="true"]{background:var(--scrub);color:var(--scrub-ink)}
.tab[aria-selected="true"] .n{color:inherit;opacity:.8}
.modedesc{color:var(--muted)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.g{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.g:hover:not(:disabled){border-color:var(--scrub)}
.g:disabled{cursor:default;background:transparent;border-style:dashed}
.g:disabled .pair{color:var(--muted)}
.g .pair{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.2;overflow-wrap:anywhere}
.g .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;font-size:.85rem;color:var(--muted)}
.chip{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.g.mix{background:var(--scrub);color:var(--scrub-ink);border-color:var(--scrub)}
.g.mix .meta{color:inherit;opacity:.85}
.teacher{font-size:.85rem;color:var(--muted);border:1.5px dashed var(--line);border-radius:10px;padding:8px 12px}

/* Spel */
.bar{display:flex;align-items:center;gap:12px;font-size:.95rem}
.back{background:none;border:none;padding:6px 0;color:var(--scrub);font-weight:700;white-space:nowrap}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--scrub);transition:width .3s}
.score{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ask{font-family:var(--display);font-weight:600;font-size:1.2rem}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;gap:14px;align-items:flex-start}
.card .txt{flex:1;min-width:0;font-size:clamp(1.15rem,4.6vw,1.4rem);line-height:1.45}
.card .term{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,7vw,2.2rem);color:var(--scrub);line-height:1.1;display:block;margin-bottom:4px}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--scrub);margin:0 2px;line-height:1.1;text-align:center;font-weight:700;color:var(--scrub)}
.speak{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--scrub)}
.speak svg{width:22px;height:22px}
.answers{display:grid;gap:12px}
.answers.m1{grid-template-columns:1fr 1fr}
.answers.m2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.answers.m3{grid-template-columns:1fr}
.ans{background:var(--surface);border:2px solid var(--scrub);border-radius:12px;padding:14px 12px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}
.m1 .ans{min-height:84px}
.ans .w{font-family:var(--display);font-weight:600;font-size:clamp(1.05rem,4.6vw,1.35rem);overflow-wrap:anywhere;text-align:center}
.m3 .ans{align-items:flex-start;text-align:left;padding:14px 16px}
.m3 .ans .w{font-family:var(--body);font-weight:400;font-size:1.05rem;text-align:left;line-height:1.45}
.ans .v{font-size:.9rem;color:var(--muted);text-align:center}
.ans:hover:not(:disabled){background:var(--scrub);color:var(--scrub-ink)}
.ans:hover:not(:disabled) .v{color:inherit}
.ans:hover:not(:disabled) mark{background:var(--scrub-ink);color:var(--scrub)}
.ans:disabled{cursor:default}
.ans.right{border-color:var(--ok);background:var(--ok-bg)}
.ans.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ans.dim{opacity:.45}
.key{font-size:.75rem;color:var(--muted);letter-spacing:.05em}
.hint{align-self:flex-start;background:none;border:1.5px dashed var(--line);border-radius:99px;padding:6px 14px;font-size:.9rem;color:var(--muted)}
.hint:disabled{opacity:.6;cursor:default}
.hintbox{font-size:.95rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
.hintbox b{color:var(--ink)}
.fb{border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}
.fb strong{font-family:var(--display);font-size:1.15rem}
.fb.ok strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.fb .rule{font-size:.95rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.fb .small{font-size:.95rem;color:var(--muted)}
.next{align-self:flex-end;background:var(--scrub);color:var(--scrub-ink);border:none;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1rem}

/* Resultat */
.big{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--scrub);line-height:1}
.missed{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.missed li{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px}
.missed .a{font-weight:700;color:var(--scrub)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn2{background:var(--surface);border:1.5px solid var(--scrub);color:var(--scrub);border-radius:10px;padding:12px 20px;font-weight:700}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   INNEHÅLL – här redigerar du ord, situationer och meningar.

   ord:     [ordet, vardagsord, fråga i läge 3]
   fraga:   frågan i läge 1
   regel:   visas när eleven svarar fel
   sortera: läge 1 och 3. [situation, rätt ord (0 eller 1), förklaring]
            <mark>...</mark> markerar det som ska bedömas.
   fyllI:   läge 2. [mening med ___, [rätt form, fel form, fel form], förklaring]
            Det första alternativet är alltid det rätta. Ordningen blandas i spelet.

   Det går att lägga till hur många situationer och meningar som helst.
   Varje runda drar ett urval, så fler uppgifter ger mer variation.
   ============================================================ */
const GRUPPER = [
 {id:"symtom",
  ord:[["symtom","det patienten känner","I vilken situation handlar det om ett symtom?"],
       ["tecken","det du ser eller mäter","I vilken situation handlar det om ett tecken?"]],
  fraga:"Är det här ett symtom eller ett tecken?",
  regel:"Ett symtom är något som patienten känner och berättar om, till exempel smärta eller yrsel. Ett tecken är något som du kan se, höra eller mäta, till exempel feber eller svullnad. Fråga dig: måste patienten berätta det, eller kan du se det själv?",
  sortera:[
   ["Patienten säger att hon blir yr när hon reser sig.",0,"Patienten säger att hon är yr. Bara hon kan känna det. Därför är det ett symtom."],
   ["Saturationen är 91 % på rumsluft.",1,"Du mäter saturationen. Därför är det ett tecken."],
   ["Patienten berättar att det värker i magen.",0,"Patienten berättar att det gör ont. Bara hon kan känna det. Därför är det ett symtom."],
   ["Du ser att anklarna är svullna.",1,"Du ser svullnaden med dina ögon. Därför är det ett tecken."],
   ["Temperaturen är 38,6 °C.",1,"Du mäter temperaturen. Därför är det ett tecken."],
   ["Patienten säger att hon mår illa.",0,"Patienten säger att hon mår illa. Bara hon kan känna det. Därför är det ett symtom."],
   ["Huden är blek och känns kall.",1,"Du ser att huden är blek och känner att den är kall. Patienten behöver inte säga något. Därför är det ett tecken."],
   ["Patienten säger att han inte kan sova för att han är orolig.",0,"Patienten berättar att han är orolig. Bara han kan känna oron. Därför är det ett symtom."],
   ["Pulsen är 118 slag per minut.",1,"Du räknar pulsen. Därför är det ett tecken."],
   ["Patienten klagar på att det kliar på ryggen.",0,"Patienten säger att det kliar. Bara hon kan känna det. Därför är det ett symtom."],
   ["Patienten säger att hon blir andfådd när hon går i trappan.",0,"Patienten säger att hon blir andfådd. Hon känner det själv. Därför är det ett symtom."],
   ["Du hör att patienten rosslar när hon andas.",1,"Du hör rosslet med dina öron. Det du kan höra, se eller mäta är ett tecken."],
   ["Patienten berättar att hon har haft huvudvärk sedan i går.",0,"Patienten berättar om huvudvärken. Du kan inte se den. Därför är det ett symtom."],
   ["Blodsockret är 2,8 mmol/l.",1,"Du mäter blodsockret. Därför är det ett tecken."],
   ["Patienten säger att det sticker i fötterna.",0,"Patienten säger att det sticker. Du kan inte se det. Därför är det ett symtom."],
   ["Du ser att patientens hud och ögonvitor är gula.",1,"Du ser den gula färgen. Därför är det ett tecken."],
   ["Patienten säger att hon känner sig nedstämd och inte orkar något.",0,"Patienten berättar hur hon mår. Bara hon vet hur det känns. Därför är det ett symtom."],
   ["Urinen är mörk och luktar starkt.",1,"Du ser färgen och känner lukten. Därför är det ett tecken."],
   ["Patienten berättar att hon har svårt att svälja.",0,"Patienten berättar att det är svårt att svälja. Hon känner det själv. Därför är det ett symtom."],
   ["Patienten har ett blåmärke på höger höft.",1,"Du ser blåmärket. Därför är det ett tecken."]
  ],
  fyllI:[
   ["Patientens ___ är illamående och yrsel.",["symtom","tecken","symtomet"],"Patienten känner illamåendet och yrseln själv. Därför är det symtom. Ordet ser likadant ut när det är flera: ett symtom, två symtom."],
   ["Du ser att läpparna är blå. Det är ett ___ på syrebrist.",["tecken","symtom","tecknet"],"Du ser att läpparna är blå. Därför är det ett tecken. Efter ”ett” heter det tecken, inte tecknet."],
   ["Patienten beskriver sina ___ för läkaren: huvudvärk och trötthet.",["symtom","symtomen","tecken"],"Patienten känner huvudvärken och tröttheten. Därför är det symtom. Efter ”sina” heter det symtom, inte symtomen."],
   ["___ försvann när patienten fick smärtlindring. Hon har inte längre ont.",["Symtomet","Tecknet","Symtom"],"Patienten känner smärtan själv. Därför är det ett symtom. Vi vet vilket symtom det gäller, smärtan. Då heter det symtomet."],
   ["Ett lågt blodtryck kan vara ett ___ på uttorkning.",["tecken","symtom","tecknen"],"Du mäter blodtrycket. Därför är det ett tecken. Efter ”ett” heter det tecken."],
   ["Vid inspektion ser du ___ på trycksår: en rodnad som inte bleknar.",["tecken","symtom","tecknet"],"Du ser rodnaden. Därför är det ett tecken. Man säger ”tecken på” något."],
   ["Feber och förhöjt CRP är ___ på infektion.",["tecken","symtom","tecknet"],"Du mäter feber och CRP. Därför är det tecken. Ordet ser likadant ut när det är flera: ett tecken, två tecken."],
   ["Patienten har inga ___ längre. Hon säger att hon känner sig helt frisk.",["symtom","tecken","symtomet"],"Patienten säger själv hur hon mår. Därför handlar det om symtom. Efter ”inga” heter det symtom."],
   ["Trötthet är ett vanligt ___ vid blodbrist.",["symtom","tecken","symtomen"],"Patienten känner tröttheten själv. Därför är det ett symtom. Efter ”ett vanligt” heter det symtom."],
   ["Du dokumenterar ___ på uttorkning: torra slemhinnor och mörk urin.",["tecken","symtom","tecknet"],"Du ser de torra slemhinnorna och den mörka urinen. Därför är det tecken. Man säger ”tecken på” något."],
   ["Läkaren frågar hur länge ___ har funnits. Patienten svarar att det har gjort ont i en vecka.",["symtomen","tecknen","symtom"],"Patienten berättar att det gör ont. Därför är det symtom. Vi vet vilka symtom det gäller. Då heter det symtomen."],
   ["Det första ___ som du ser är att patienten har svårt att hitta orden.",["tecknet","symtomet","tecken"],"Du ser själv att patienten har svårt att hitta orden. Därför är det ett tecken. Efter ”det första” heter det tecknet."]
  ]},
 {id:"observera",
  ord:[["observera","se, höra och mäta","I vilken situation observerar någon?"],
       ["bedöma","komma fram till vad det betyder","I vilken situation bedömer någon?"]],
  fraga:"Observerar eller bedömer personen?",
  regel:"Att observera är att se, höra och mäta. Du beskriver vad du ser, men du säger inte vad det betyder. Att bedöma är att komma fram till vad det betyder eller vad som ska göras. Fråga dig: beskriver personen bara, eller kommer hon fram till något?",
  sortera:[
   ["Du räknar andningen till 24 andetag per minut.",0,"Du räknar andetagen. Du säger inte vad det betyder. Därför observerar du."],
   ["Sjuksköterskan kommer fram till att patienten har tecken på infektion.",1,"Sjuksköterskan kommer fram till vad det betyder. Därför bedömer hon."],
   ["Du ser att patienten bara har ätit halva portionen.",0,"Du ser hur mycket som är kvar på tallriken. Därför observerar du."],
   ["Sjuksköterskan avgör att patienten behöver kontrolleras varje timme.",1,"Sjuksköterskan bestämmer vad som ska hända. Därför bedömer hon."],
   ["Du märker att patienten svarar långsammare än i morse.",0,"Du märker en förändring. Du säger inte vad den beror på. Därför observerar du."],
   ["Läkaren drar slutsatsen att andnöden beror på hjärtsvikt.",1,"Läkaren säger vad andnöden beror på. Därför bedömer läkaren."],
   ["Du läser av blodtrycket: 92/58.",0,"Du mäter blodtrycket. Därför observerar du."],
   ["Utifrån NEWS-poängen avgör sjuksköterskan att läkaren ska kontaktas.",1,"Sjuksköterskan använder mätvärdena och bestämmer vad som ska göras. Därför bedömer hon."],
   ["Du ser att patienten håller handen mot bröstet.",0,"Du ser vad patienten gör. Du säger inte vad det betyder. Därför observerar du."],
   ["Sjuksköterskan anser att smärtlindringen inte räcker.",1,"”Anser” betyder ungefär ”tycker”. Sjuksköterskan säger vad hon tycker att patienten behöver. Därför bedömer hon."],
   ["Du hör att patienten hostar mer i kväll.",0,"Du hör att patienten hostar mer. Därför observerar du."],
   ["Sjuksköterskan avgör att såret behöver ses av en läkare.",1,"Sjuksköterskan bestämmer vad som ska hända med såret. Därför bedömer hon."],
   ["Du väger patienten: 58 kilo.",0,"Du väger patienten. Det är ett mätvärde. Därför observerar du."],
   ["Sjuksköterskan kommer fram till att patienten har ont, trots att hon inte säger något.",1,"Sjuksköterskan kommer fram till något som patienten inte har sagt. Därför bedömer hon."],
   ["Du ser att patienten grimaserar när hon vänder sig i sängen.",0,"Du ser patientens ansikte. Du säger inte vad det betyder. Därför observerar du."],
   ["Läkaren avgör att patienten inte behöver antibiotika.",1,"Läkaren bestämmer om patienten ska få läkemedel. Därför bedömer läkaren."],
   ["Du räknar hur många gånger patienten går på toaletten under natten.",0,"Du räknar. Du säger inte vad det betyder. Därför observerar du."],
   ["Fysioterapeuten avgör att patienten kan börja gå med rollator.",1,"Fysioterapeuten bestämmer vad patienten klarar. Därför bedömer fysioterapeuten."],
   ["Du lägger märke till att patienten inte har rört sitt kaffe.",0,"Du ser att kaffet står kvar. Därför observerar du."],
   ["Sjuksköterskan tar ställning till om patienten behöver extra tillsyn i natt.",1,"”Tar ställning” betyder att hon bestämmer sig. Därför bedömer hon."]
  ],
  fyllI:[
   ["Under natten ___ du att patienten är orolig och går upp flera gånger.",["observerar","bedömer","observera"],"Du ser hur patienten gör. Därför observerar du. Det händer nu. Då heter det observerar."],
   ["Enligt sjuksköterskans ___ behöver patienten tätare kontroller.",["bedömning","observation","bedömer"],"Sjuksköterskan har kommit fram till vad som behövs. Det är en bedömning. Efter ”sjuksköterskans” heter det bedömning, inte bedömer."],
   ["Du skriver ner dina ___: patienten har ätit lite och druckit två glas vatten.",["observationer","bedömningar","observerar"],"Du skriver vad du har sett, inte vad det betyder. Det är observationer. Efter ”dina” heter det observationer, inte observerar."],
   ["Läkaren ___ att patienten kan åka hem i morgon.",["bedömer","observerar","bedöma"],"Läkaren bestämmer om patienten kan åka hem. Därför bedömer läkaren. Det händer nu. Då heter det bedömer."],
   ["Igår ___ du att patienten haltade på vänster ben.",["observerade","bedömde","observerar"],"Du såg hur patienten gick. Därför observerade du. ”Igår” betyder att det redan har hänt. Då heter det observerade."],
   ["Sjuksköterskan ___ igår att såret läker som det ska.",["bedömde","observerade","bedömer"],"”Läker som det ska” är något sjuksköterskan kommer fram till. Därför bedömde hon. ”Igår” betyder att det redan har hänt. Då heter det bedömde."],
   ["Det är viktigt att du ___ hur patienten andas under natten.",["observerar","bedömer","observation"],"Du ska se och lyssna. Därför observerar du. Efter ”att du” heter det observerar."],
   ["Utifrån smärtskalan gör sjuksköterskan en ___ av om patienten behöver mer smärtlindring.",["bedömning","observation","bedöma"],"Sjuksköterskan kommer fram till om patienten behöver mer smärtlindring. Det är en bedömning. Efter ”en” heter det bedömning, inte bedöma."],
   ["Du ska ___ patientens allmäntillstånd och säga till om något förändras.",["observera","bedöma","observerar"],"Du ska lägga märke till förändringar. Därför ska du observera. Efter ”ska” heter det observera, inte observerar."],
   ["Att avgöra om patienten behöver läkare är sjuksköterskans ___.",["bedömning","observation","bedömer"],"Att avgöra om patienten behöver läkare är att bedöma. Efter ”sjuksköterskans” heter det bedömning."],
   ["Efter samtalet ___ sjuksköterskan att patienten var redo att flytta hem.",["bedömde","observerade","bedömer"],"Sjuksköterskan kom fram till att patienten var redo. Därför bedömde hon. Det har redan hänt. Då heter det bedömde."],
   ["Du har ___ att patienten har svårt att hålla i skeden.",["observerat","bedömt","observera"],"Du har sett det själv. Därför har du observerat. Efter ”har” heter det observerat."]
  ]},
 {id:"framja",
  ord:[["främja","göra något bra ännu bättre","Vilken åtgärd främjar hälsan?"],
       ["förebygga","stoppa något dåligt innan det händer","Vilken åtgärd förebygger något?"]],
  fraga:"Främjar eller förebygger åtgärden?",
  regel:"Att främja är att göra något bra ännu bättre, till exempel hälsa, glädje eller ork. Att förebygga är att stoppa något dåligt innan det händer, till exempel fall, sår eller smitta. Fråga dig: vill vi få mer av något bra, eller stoppa något dåligt?",
  sortera:[
   ["Du vänder patienten varannan timme så att hon inte får trycksår.",1,"Målet är att stoppa trycksår innan de kommer. Det är att förebygga."],
   ["Du uppmuntrar patienten att träffa vännerna i dagrummet, eftersom gemenskapen får henne att må bra.",0,"Målet är att patienten ska må ännu bättre. Det är att främja."],
   ["Patienten får kompressionsstrumpor efter operationen.",1,"Målet är att stoppa en blodpropp innan den kommer. Det är att förebygga."],
   ["Ni tar bort lösa mattor så att patienten inte ska ramla.",1,"Målet är att stoppa ett fall innan det händer. Det är att förebygga."],
   ["Du hjälper patienten att hitta en hobby som hon tycker om.",0,"Målet är att patienten ska få mer glädje. Det är att främja."],
   ["Du tvättar händerna mellan varje patient.",1,"Målet är att stoppa smitta. Det är att förebygga."],
   ["Ni går ut i solen en stund varje dag, eftersom det ger patienten energi.",0,"Målet är att patienten ska få mer energi och bättre humör. Det är att främja."],
   ["Patienten vaccineras mot influensa.",1,"Målet är att stoppa influensa innan patienten blir sjuk. Det är att förebygga."],
   ["Du ger beröm när patienten klarar att klä på sig själv, så att hon känner sig stark.",0,"Målet är att patienten ska känna sig starkare. Det är att främja."],
   ["Du påminner patienten om att dricka så att hon inte blir uttorkad.",1,"Målet är att stoppa uttorkning. Det är att förebygga."],
   ["Du dukar fint och sätter på musik vid middagen, så att patienten får lust att äta och trivs.",0,"Målet är mer matlust och trivsel. Det är att främja."],
   ["Patienten får sjunga i kören på boendet, eftersom det gör henne glad.",0,"Målet är mer glädje. Det är att främja."],
   ["Ni planterar blommor på balkongen tillsammans, eftersom patienten tycker om att pyssla med växter.",0,"Målet är mer glädje i vardagen. Det är att främja."],
   ["Ni går en promenad varje dag så att patienten får frisk luft och känner sig piggare.",0,"Målet är mer ork och bättre humör. Det är att främja."],
   ["Du hjälper patienten att ringa sitt barnbarn varje söndag, eftersom samtalen gör henne glad.",0,"Målet är att patienten ska må ännu bättre. Det är att främja."],
   ["Personalen ordnar gympa till musik så att de boende får mer ork och glädje i vardagen.",0,"Målet är mer ork och glädje. Det är att främja."],
   ["Du torkar upp vatten på golvet direkt så att ingen halkar.",1,"Målet är att stoppa ett fall innan det händer. Det är att förebygga."],
   ["Du smörjer patientens torra fötter så att huden inte spricker.",1,"Målet är att stoppa sår innan de kommer. Det är att förebygga."],
   ["Patienten får ett extra mellanmål på kvällen så att hon inte går ner i vikt.",1,"Målet är att stoppa viktminskning. Det är att förebygga."],
   ["Du använder handskar och förkläde när du hjälper en patient med magsjuka.",1,"Målet är att stoppa smittan. Det är att förebygga."]
  ],
  fyllI:[
   ["Patienten får kompressionsstrumpor i ___ syfte.",["förebyggande","främjande","förebygga"],"Strumporna ska stoppa en blodpropp. Man säger ”i förebyggande syfte”."],
   ["Lägesändring varannan timme ___ trycksår.",["förebygger","främjar","förebygga"],"Trycksår är något dåligt som ska stoppas. Därför förebygger lägesändringen trycksår. Den som ”främjar trycksår” gör så att de blir fler!"],
   ["Fysisk aktivitet ___ både den fysiska och den psykiska hälsan.",["främjar","förebygger","främja"],"Hälsa är något bra som ska bli ännu bättre. Därför främjar aktiviteten hälsan. Man kan inte förebygga hälsa."],
   ["Ni ___ fall genom att ha bra belysning i korridoren.",["förebygger","främjar","förebyggde"],"Fall är något dåligt som ska stoppas. Därför förebygger ni fall. Det händer nu. Då heter det förebygger."],
   ["Ett gott socialt nätverk ___ välbefinnandet.",["främjar","förebygger","främjade"],"Välbefinnande betyder att man mår bra. Det blir ännu bättre. Därför främjar nätverket välbefinnandet."],
   ["Målet med kursen är att deltagarna ska må bättre och få mer energi. Det är ___ arbete.",["hälsofrämjande","förebyggande","främja"],"Kursen ska göra att deltagarna mår ännu bättre. Därför heter det hälsofrämjande arbete."],
   ["Hembesöket görs i ___ syfte. Ni letar efter saker som patienten kan snubbla på.",["förebyggande","främjande","förebygga"],"Ni vill stoppa fall. Man säger ”i förebyggande syfte”."],
   ["Musik och sång kan ___ välbefinnandet hos personer med demens.",["främja","förebygga","främjar"],"Välbefinnande är något bra. Därför kan musiken främja det. Efter ”kan” heter det främja, inte främjar."],
   ["Basala hygienrutiner ___ att smitta sprids.",["förebygger","främjar","förebygga"],"Smitta är något dåligt som ska stoppas. Därför förebygger rutinerna att smitta sprids."],
   ["Att ___ hälsa handlar om att stärka det som får människor att må bra.",["främja","förebygga","främjar"],"Man gör det friska ännu starkare. Därför handlar det om att främja. Efter ”att” heter det främja."],
   ["Igår ___ ni trycksår genom att lägga patienten på en tryckavlastande madrass.",["förebyggde","främjade","förebygger"],"Trycksår ska stoppas. Därför förebyggde ni dem. ”Igår” betyder att det redan har hänt. Då heter det förebyggde."],
   ["Kursen i matlagning har ett ___ syfte. Deltagarna ska få mer glädje och energi i vardagen.",["hälsofrämjande","förebyggande","främjar"],"Deltagarna ska få mer glädje och energi. Därför har kursen ett hälsofrämjande syfte."]
  ]},
 {id:"rapportera",

   ["Du skriver i journalen hur patienten har sovit under natten.",1,"Du skriver i journalen. Därför dokumenterar du."],

   ["Vid morgonmötet berättar du att patienten var orolig under kvällen.",0,"Du berättar för kollegorna. Därför rapporterar du."],
   ["Du fyller i en lista över hur många gånger patienten har kissat.",1,"Du skriver i en lista. Därför dokumenterar du."],
   ["Du larmar och säger till sjuksköterskan att patienten har svårt att andas.",0,"Du säger det direkt till sjuksköterskan. Därför rapporterar du."],

   ["I telefon berättar du för sjuksköterskan att patienten har ont i bröstet.",0,"Du pratar med sjuksköterskan i telefon. Därför rapporterar du."],
   ["Du skriver i journalen vad patienten åt och drack till lunch.",1,"Du skriver i journalen. Därför dokumenterar du."]
  ],
  fyllI:[
   ["Vid passbytet ger du ___ till kvällspersonalen.",["rapport","dokumentation","rapportera"],"Vid passbytet berättar du för kollegorna. Det heter att ge rapport."],
   ["Du ___ i journalen att patienten inte ville ta sin medicin.",["dokumenterar","rapporterar","dokumentera"],"Du skriver i journalen. Därför dokumenterar du. Det händer nu. Då heter det dokumenterar."],
   ["Du ___ direkt till sjuksköterskan att patienten har ramlat.",["rapporterar","dokumenterar","rapport"],"Du säger det till sjuksköterskan. Därför rapporterar du. Det händer nu. Då heter det rapporterar."],
   ["God ___ gör att nästa person kan läsa vad som har hänt.",["dokumentation","rapport","dokumentera"],"Det man kan läsa är skrivet. Därför är det dokumentation. Efter ”god” heter det dokumentation, inte dokumentera."],
   ["Igår ___ du till sjuksköterskan att patienten hade fått utslag.",["rapporterade","dokumenterade","rapporterar"],"Du berättade för sjuksköterskan. Därför rapporterade du. ”Igår” betyder att det redan har hänt. Då heter det rapporterade."],
   ["Det som inte är ___ har inte hänt, brukar man säga i vården.",["dokumenterat","rapporterat","dokumentera"],"Meningen handlar om det som står i journalen. Efter ”är” heter det dokumenterat."],
   ["Du ___ till sjuksköterskan när något förändras hos patienten.",["rapporterar","dokumenterar","rapport"],"Du säger det till sjuksköterskan. Därför rapporterar du."],
   ["Allt som är viktigt för vården ska ___ i journalen.",["dokumenteras","rapporteras","dokumentera"],"Det som står i journalen är skrivet. Därför ska det dokumenteras."],

   ["Igår ___ du i journalen att patienten hade feber.",["dokumenterade","rapporterade","dokumenterar"],"Du skrev i journalen. Därför dokumenterade du. ”Igår” betyder att det redan har hänt. Då heter det dokumenterade."],
   ["Sjuksköterskan läser din ___ för att se vad som hände under natten.",["dokumentation","rapport","dokumenterar"],"Det man läser är skrivet. Därför är det dokumentation. Efter ”din” heter det dokumentation."],
   ["Du har ___ till sjuksköterskan att patienten har ramlat. Nu ska du också skriva en avvikelse.",["rapporterat","dokumenterat","rapportera"],"Du har berättat för sjuksköterskan. Därför har du rapporterat. Efter ”har” heter det rapporterat."]

 {id:"kurativ",
  ord:[["kurativ","botande, patienten blir frisk","Vilken behandling är kurativ?"],
       ["palliativ","lindrande, det blir lättare","Vilken behandling är palliativ?"]],
  fraga:"Är behandlingen kurativ eller palliativ?",
  regel:"Kurativ behandling ska bota. Patienten ska bli frisk. Palliativ behandling ska lindra, alltså göra det lättare för patienten när sjukdomen inte går att bota. Samma behandling kan vara kurativ eller palliativ. Fråga dig: vad är målet, att patienten ska bli frisk eller att hon ska må så bra som möjligt?",
  sortera:[
   ["Patienten opereras för att hela tumören ska tas bort.",0,"Hela tumören tas bort så att patienten blir frisk. Därför är behandlingen kurativ."],
   ["Patienten med spridd cancer får morfin så att smärtan lindras.",1,"Cancern går inte att bota. Morfinet gör att det gör mindre ont. Därför är behandlingen palliativ."],
   ["Patienten får antibiotika mot lunginflammation.",0,"Antibiotikan tar bort infektionen och patienten blir frisk. Därför är behandlingen kurativ."],
   ["Patienten i livets slutskede får munvård så att munnen inte blir torr.",1,"Patienten ska inte bli frisk. Munvården gör att hon har det bättre. Därför är det palliativ vård."],
   ["Ett brutet ben opereras så att det kan läka.",0,"Benet ska läka och bli helt igen. Därför är behandlingen kurativ."],
   ["Patienten får strålning mot en metastas i ryggen för att minska smärtan.",1,"Strålningen ska minska smärtan. Den ska inte bota cancern. Därför är den palliativ."],
   ["Patienten får cellgifter för att bli helt frisk från sin leukemi.",0,"Målet är att patienten ska bli helt frisk. Därför är behandlingen kurativ."],
   ["Patienten med svår hjärtsvikt får syrgas och lugn omkring sig så att andnöden känns mindre.",1,"Andnöden ska kännas mindre. Sjukdomen botas inte. Därför är vården palliativ."],
   ["Gallstenarna opereras bort så att besvären försvinner.",0,"Gallstenarna tas bort och patienten blir frisk. Därför är behandlingen kurativ."],
   ["Patienten får läkemedel mot illamående under sina sista veckor.",1,"Patienten ska må bättre under den sista tiden. Därför är behandlingen palliativ."],
   ["Patienten opereras för blindtarmsinflammation.",0,"Blindtarmen tas bort och patienten blir frisk. Därför är behandlingen kurativ."],
   ["Patienten med ALS får hjälp med andningen på natten så att hon kan sova bättre.",1,"ALS går inte att bota. Hjälpen gör att hon sover bättre. Därför är behandlingen palliativ."],
   ["Patienten får en ny höftled efter en höftfraktur, så att hon kan gå igen.",0,"Höften ska fungera igen, så att patienten kan gå. Därför är behandlingen kurativ."],
   ["Patienten i livets slutskede får hjälp att byta läge så att hon ligger bekvämt.",1,"Patienten ska ligga bekvämt. Hon ska inte bli frisk. Därför är det palliativ vård."],
   ["Patienten får penicillin mot halsfluss.",0,"Penicillinet tar bort infektionen och patienten blir frisk. Därför är behandlingen kurativ."],
   ["Patienten med obotlig cancer får kortison så att hon får bättre aptit och mer ork.",1,"Cancern går inte att bota. Kortisonet ger bättre aptit och mer ork. Därför är behandlingen palliativ."],
   ["En hudtumör opereras bort helt.",0,"Hela tumören tas bort så att patienten blir frisk. Därför är behandlingen kurativ."],
   ["Patienten i livets slutskede får ångestdämpande läkemedel så att hon känner sig lugn.",1,"Patienten ska känna sig lugn under den sista tiden. Därför är behandlingen palliativ."],
   ["Patienten får strålning för att bota en tumör i bröstet.",0,"Strålningen ska bota. Därför är den kurativ. Strålning kan alltså vara både kurativ och palliativ. Det är målet som avgör."],
   ["Patienten med obotlig lungsjukdom får en fläkt vid sängen som minskar känslan av andnöd.",1,"Sjukdomen går inte att bota. Fläkten gör att andnöden känns mindre. Därför är det palliativ vård."]
  ],
  fyllI:[
   ["Operationen görs i ___ syfte. Målet är att patienten ska bli frisk.",["kurativt","palliativt","kurativ"],"Målet är att patienten ska bli frisk. Därför är syftet kurativt. Det heter ”ett syfte”. Då får ordet -t: kurativt."],
   ["Patienten är i ett ___ skede. Nu är smärtlindring och trygghet viktigast.",["palliativt","kurativt","palliativ"],"Patienten kan inte bli frisk. Nu är smärtlindring och trygghet viktigast. Därför är skedet palliativt. Det heter ”ett skede”. Då får ordet -t."],
   ["På avdelningen för ___ vård vårdas patienter i livets slutskede.",["palliativ","kurativ","palliativa"],"Vård i livets slutskede ska lindra. Därför heter det palliativ vård."],
   ["När cancern har spridit sig ändras behandlingen från kurativ till ___.",["palliativ","kurativ","palliativt"],"När sjukdomen inte längre går att bota blir målet att lindra. Därför blir behandlingen palliativ."],
   ["Antibiotika mot en urinvägsinfektion är en ___ behandling.",["kurativ","palliativ","kurativa"],"Antibiotikan botar infektionen. Därför är behandlingen kurativ. Efter ”en” heter det kurativ."],
   ["Strålningen ges i ___ syfte. Den ska minska smärtan från metastasen.",["palliativt","kurativt","palliativ"],"Strålningen ska minska smärtan, inte bota. Därför är syftet palliativt. Det heter ”ett syfte”. Då får ordet -t."],
   ["Målet med ___ vård är god livskvalitet, inte att bota.",["palliativ","kurativ","palliativt"],"Målet är att må så bra som möjligt, inte att bli frisk. Därför heter det palliativ vård."],
   ["Behandlingen är ___. Patienten förväntas bli helt frisk.",["kurativ","palliativ","kurativt"],"Patienten ska bli frisk. Därför är behandlingen kurativ. Det heter ”en behandling”. Då får ordet inget -t."],
   ["Läkaren berättar att det inte längre finns någon ___ behandling. Nu ska vården inriktas på lindring.",["kurativ","palliativ","kurativa"],"Det finns ingen behandling som kan göra patienten frisk. Därför finns ingen kurativ behandling. Efter ”någon” heter det kurativ."],
   ["Smärtlindringen ges i ___ syfte, eftersom sjukdomen inte kan botas.",["palliativt","kurativt","palliativ"],"Sjukdomen går inte att bota. Smärtlindringen ska lindra. Därför är syftet palliativt. Det heter ”ett syfte”. Då får ordet -t."],
   ["Många ___ behandlingar, till exempel operationer, ska ta bort orsaken till sjukdomen.",["kurativa","palliativa","kurativ"],"Operationerna ska ta bort orsaken så att patienten blir frisk. Därför är de kurativa. Det är flera behandlingar. Då får ordet -a."],
   ["I det ___ skedet är det viktigt att även de närstående får stöd.",["palliativa","kurativa","palliativt"],"Stöd till de närstående är en viktig del av palliativ vård. Efter ”det” får ordet -a: det palliativa skedet."]
  ]},
 {id:"indikation",
  ord:[["indikation","anledning att göra något","I vilken situation är det markerade en indikation?"],
       ["kontraindikation","anledning att låta bli","I vilken situation är det markerade en kontraindikation?"]],
  fraga:"Är det markerade en indikation eller en kontraindikation?",
  regel:"En indikation är en anledning att göra något, till exempel ge ett läkemedel eller ta ett prov. En kontraindikation är en anledning att låta bli. Fråga dig: talar det markerade för att man ska göra det, eller emot?",
  sortera:[
   ["Patienten har <mark>bröstsmärta</mark>. Läkaren beställer ett EKG.",0,"Bröstsmärtan är anledningen till att man tar EKG. Därför är den en indikation."],
   ["Patienten är <mark>gravid</mark>. Läkaren funderar på ett läkemedel som kan skada fostret.",1,"Läkemedlet kan skada fostret. Graviditeten är en anledning att låta bli. Därför är den en kontraindikation."],
   ["Patienten har <mark>feber och hosta</mark>. Läkaren beställer en lungröntgen.",0,"Febern och hostan är anledningen till röntgen. Därför är de en indikation."],
   ["Patienten är <mark>allergisk mot penicillin</mark>. Läkaren funderar på att ge penicillin.",1,"Patienten kan bli sjuk av penicillinet. Allergin är en anledning att låta bli. Därför är den en kontraindikation."],
   ["Patienten har <mark>svår smärta efter operationen</mark>. Hon får smärtlindring.",0,"Smärtan är anledningen till smärtlindringen. Därför är den en indikation."],
   ["Patienten har <mark>ett blödande magsår</mark>. Läkaren funderar på blodförtunnande läkemedel.",1,"Blodförtunnande läkemedel kan göra att magsåret blöder mer. Därför är magsåret en kontraindikation."],
   ["Patienten har <mark>högt blodtryck</mark>. Läkaren skriver ut blodtryckssänkande läkemedel.",0,"Det höga blodtrycket är anledningen till läkemedlet. Därför är det en indikation."],
   ["Patienten har <mark>mycket lågt blodtryck</mark>. Läkaren funderar på blodtryckssänkande läkemedel.",1,"Blodtrycket är redan lågt. Det ska inte sänkas mer. Därför är det en kontraindikation."],
   ["Patienten har <mark>nyss ätit</mark>. Hon ska sövas för en planerad operation.",1,"Man ska inte äta innan man sövs. Att hon har ätit är en anledning att vänta. Därför är det en kontraindikation."],
   ["Patienten har <mark>urinstämma</mark>. Sjuksköterskan sätter en kateter.",0,"Urinstämma betyder att urinen inte kommer ut. Det är anledningen till katetern. Därför är det en indikation."],
   ["Patienten har <mark>svårt att andas och låg saturation</mark>. Hon får syrgas.",0,"Den låga saturationen är anledningen till syrgasen. Därför är den en indikation."],
   ["Patienten har <mark>ett örhänge av metall</mark>. Hon ska undersökas med magnetkamera.",1,"Magneten drar i metall och kan skada huden. Örhänget måste tas av först. Därför är det en kontraindikation."],
   ["Patienten har <mark>ett djupt sår som blöder kraftigt</mark>. Hon får ett tryckförband.",0,"Blödningen är anledningen till tryckförbandet. Därför är den en indikation."],
   ["Patienten har <mark>svårt att svälja</mark>. Sjuksköterskan funderar på att ge en stor tablett.",1,"Tabletten kan fastna i halsen. Det är en anledning att låta bli. Därför är det en kontraindikation."],
   ["Patienten har <mark>hög feber</mark>. Hon får febernedsättande läkemedel.",0,"Febern är anledningen till läkemedlet. Därför är den en indikation."],
   ["Patienten har <mark>ont i halsen och vita beläggningar på mandlarna</mark>. Läkaren tar ett snabbtest för streptokocker.",0,"Besvären i halsen är anledningen till testet. Därför är de en indikation."],
   ["Patienten har <mark>en infektion i huden på låret</mark>. Sjuksköterskan funderar på att ge en spruta just där.",1,"Man ska inte sticka i hud som har en infektion. Därför är infektionen en kontraindikation."],
   ["Patienten har <mark>en blodpropp i benet</mark>. Hon får blodförtunnande läkemedel.",0,"Blodproppen är anledningen till det blodförtunnande läkemedlet. Därför är den en indikation."],
   ["Patienten <mark>kräks hela tiden</mark>. Läkaren funderar på att ge läkemedlet som tablett.",1,"Tabletten kommer upp igen innan den har hunnit verka. Därför är kräkningarna en kontraindikation."]
  ],
  fyllI:[
   ["Bröstsmärta är en ___ för EKG.",["indikation","kontraindikation","indicerad"],"Bröstsmärta är en anledning att ta EKG. Därför är det en indikation. Efter ”en” heter det indikation, inte indicerad."],

 {id:"hallucination",
  ord:[["hallucination","ser eller hör något som inte finns","I vilken situation har patienten en hallucination?"],
       ["vanföreställning","är helt säker på något som inte är sant","I vilken situation har patienten en vanföreställning?"]],
  fraga:"Är det en hallucination eller en vanföreställning?",
  regel:"En hallucination sitter i sinnena. Patienten ser, hör, känner eller luktar något som inte finns. En vanföreställning sitter i tankarna. Patienten är helt säker på något som inte är sant, och du kan inte få henne att ändra sig. Fråga dig: ser, hör eller känner patienten något, eller tänker hon något?",
  sortera:[
   ["Patienten säger att hon ser små djur som springer på golvet. Golvet är tomt.",0,"Hon ser djur som inte finns. Det sitter i synen. Därför är det en hallucination."],
   ["Patienten är säker på att personalen har förgiftat maten.",1,"Ingen har förgiftat maten, men hon är helt säker på det. Det är en tanke. Därför är det en vanföreställning."],
   ["Patienten hör röster som pratar med honom, fast ingen är i rummet.",0,"Han hör röster som inte finns. Det sitter i hörseln. Därför är det en hallucination."],
   ["Patienten är säker på att dottern har stulit hennes smycken. Smyckena ligger i lådan.",1,"Smyckena ligger kvar i lådan, men hon är ändå säker på att de är stulna. Det är en tanke. Därför är det en vanföreställning."],
   ["Patienten säger att det luktar bränt i rummet. Ingen annan känner någon lukt.",0,"Hon känner en lukt som inte finns. Det sitter i luktsinnet. Därför är det en hallucination."],
   ["Patienten säger att grannarna har satt kameror i taklampan för att övervaka henne.",1,"Det finns inga kameror. Hon ser dem inte, men hon är helt säker på att de finns. Det är en tanke. Därför är det en vanföreställning."],
   ["Patienten säger att det kryper insekter under huden. Du ser inga insekter.",0,"Hon känner något på huden som inte finns. Det sitter i känseln. Därför är det en hallucination."],
   ["Patienten är övertygad om att han är kungens son och ska ärva slottet.",1,"Han är inte kungens son, men han är helt säker på det. Det är en tanke. Därför är det en vanföreställning."],
   ["Patienten pratar med sin döda man och säger att han sitter i fåtöljen.",0,"Hon ser sin man i fåtöljen, men han finns inte där. Det sitter i synen. Därför är det en hallucination."],
   ["Patienten är säker på att hon är fattig och inte har råd med mat. Hon har gott om pengar.",1,"Hon har pengar, men hon är helt säker på att hon är fattig. Det är en tanke. Därför är det en vanföreställning."],
   ["Patienten ser barn som leker i hörnet av rummet. Där finns inga barn.",0,"Hon ser barn som inte finns. Det sitter i synen. Därför är det en hallucination."],
   ["Patienten tror att TV:n skickar hemliga meddelanden till honom.",1,"TV:n skickar inga meddelanden, men han är helt säker på det. Det är en tanke. Därför är det en vanföreställning."],
   ["Patienten hör musik från väggen, fast det är helt tyst.",0,"Han hör musik som inte finns. Det sitter i hörseln. Därför är det en hallucination."],
   ["Du visar patienten att dörren är låst. Han är ändå säker på att någon kommer in på natten och flyttar hans saker.",1,"Du visar att dörren är låst, men han ändrar sig inte. Det är en tanke. Därför är det en vanföreställning."],
   ["Patienten säger att någon ropar hennes namn i korridoren. Korridoren är tom.",0,"Hon hör en röst som inte finns. Det sitter i hörseln. Därför är det en hallucination."],
   ["Patienten är säker på att hon har en dödlig sjukdom. Alla prover är bra, men hon går inte att lugna.",1,"Proverna är bra, men hon är helt säker på att hon är sjuk. Det är en tanke. Därför är det en vanföreställning."],
   ["Patienten känner att någon nuddar hennes axel, fast ingen står nära.",0,"Hon känner en hand som inte finns. Det sitter i känseln. Därför är det en hallucination."],
   ["Patienten är säker på att hennes man har en annan kvinna. Det finns inget som tyder på det.",1,"Inget tyder på det, men hon är helt säker. Det är en tanke. Därför är det en vanföreställning."],
   ["Varje natt ser patienten en man som står vid fönstret. Där står ingen.",0,"Han ser en man som inte finns. Det sitter i synen. Därför är det en hallucination."],
   ["Patienten är säker på att personalen planerar att skicka bort honom. Ingen har planerat det.",1,"Ingen har planerat det, men han är helt säker. Det är en tanke. Därför är det en vanföreställning."]
  ],
  fyllI:[
   ["Patienten hör röster som ingen annan hör. Hon har ___.",["hallucinationer","vanföreställningar","hallucination"],"Hon hör röster som inte finns. Det sitter i hörseln. Därför är det hallucinationer. Efter ”har” utan ”en” heter det hallucinationer, alltså flera."],
   ["Patienten är säker på att personalen stjäl hennes pengar. Det är en ___.",["vanföreställning","hallucination","vanföreställningen"],"Ingen stjäl pengarna, men hon är helt säker. Därför är det en vanföreställning. Efter ”en” heter det vanföreställning, inte vanföreställningen."],
   ["Patienten ___ just nu. Hon ser insekter på väggen.",["hallucinerar","hallucination","hallucinerade"],"Hon ser insekter som inte finns. ”Just nu” betyder att det händer nu. Då heter det hallucinerar."],
   ["Igår ___ patienten. Hon såg katter i sängen.",["hallucinerade","hallucinerar","hallucination"],"Hon såg katter som inte fanns. ”Igår” betyder att det redan har hänt. Då heter det hallucinerade."],
   ["___ gör att patienten inte vill dricka vatten. Hon tror att grannen har förgiftat det.",["Vanföreställningen","Hallucinationen","Vanföreställning"],"Vattnet är inte förgiftat, men hon är säker på det. Det är en tanke. Vi vet vilken vanföreställning det gäller. Då heter det vanföreställningen."],
   ["Det går inte att prata bort en ___. Patienten är helt säker på att hon har rätt.",["vanföreställning","hallucination","vanföreställningar"],"Patienten är helt säker och går inte att få att ändra sig. Därför är det en vanföreställning. Efter ”en” heter det vanföreställning."],
   ["Vid demens kan personen få ___ och se människor som inte finns.",["hallucinationer","vanföreställningar","hallucinationen"],"Att se människor som inte finns sitter i synen. Därför är det hallucinationer. Efter ”få” utan ”en” heter det hallucinationer, alltså flera."],
   ["Patientens ___ är att hon är drottning och äger hela boendet.",["vanföreställning","hallucination","vanföreställningen"],"Hon är inte drottning, men hon är helt säker. Därför är det en vanföreställning. Efter ”patientens” heter det vanföreställning, inte vanföreställningen."],
   ["Du dokumenterar att patienten har ___: hon hör musik som ingen annan hör.",["hörselhallucinationer","vanföreställningar","hallucinerar"],"Hon hör musik som inte finns. En hallucination i hörseln kallas hörselhallucination."],
   ["___ försvann när patienten fick behandling mot infektionen. Hon slutade se djur på golvet.",["Hallucinationerna","Vanföreställningarna","Hallucinationer"],"Hon såg djur som inte fanns. Det sitter i synen. Vi vet vilka hallucinationer det gäller. Då heter det hallucinationerna."],
   ["Patienten har ___. Han tror att personalen vill skada honom.",["vanföreställningar","hallucinationer","vanföreställning"],"Ingen vill skada honom, men han är helt säker. Därför är det vanföreställningar. Efter ”har” utan ”en” heter det vanföreställningar, alltså flera."],
   ["En ___ kan sitta i alla sinnen: syn, hörsel, lukt, smak och känsel.",["hallucination","vanföreställning","hallucinationer"],"Sinnena är syn, hörsel, lukt, smak och känsel. Hallucinationer sitter i sinnena. Efter ”en” heter det hallucination."]
  ]},
 {id:"rehabilitering",
  ord:[["rehabilitering","få tillbaka det man kunde förut","I vilken situation handlar det om rehabilitering?"],
       ["habilitering","lära sig något man aldrig har kunnat","I vilken situation handlar det om habilitering?"]],
  fraga:"Är det rehabilitering eller habilitering?",
  regel:"Rehabilitering är för den som kunde något förut men har förlorat det, till exempel efter en stroke eller en olycka. Målet är att få tillbaka det man kunde. Habilitering är för den som har haft en funktionsnedsättning sedan födseln eller sedan hon var liten. Målet är att lära sig något man aldrig har kunnat. Fråga dig: kunde personen det här förut?",
  sortera:[
   ["Patienten tränar på att gå igen efter sin höftoperation.",0,"Hon kunde gå förut. Nu ska hon få tillbaka det. Därför är det rehabilitering."],
   ["En flicka med cerebral pares tränar på att sitta själv med stöd av en fysioterapeut.",1,"Hon har haft CP sedan hon var liten. Hon lär sig något nytt. Därför är det habilitering."],
   ["Efter sin stroke tränar patienten med arbetsterapeuten för att kunna klä på sig själv igen.",0,"Han kunde klä på sig före stroken. Ordet ”igen” visar att han ska få tillbaka det. Därför är det rehabilitering."],
   ["En pojke med autism får bildstöd för att förstå vad som ska hända under dagen.",1,"Autism har man sedan man är liten. Han lär sig ett nytt sätt att förstå dagen. Därför är det habilitering."],
   ["En man som skadade ryggen i en trafikolycka tränar för att kunna gå tillbaka till sitt jobb.",0,"Han kunde arbeta före olyckan. Nu ska han få tillbaka det. Därför är det rehabilitering."],
   ["Ett barn som föddes döv lär sig teckenspråk.",1,"Barnet har aldrig kunnat höra. Det lär sig något helt nytt. Därför är det habilitering."],
   ["Patienten tränar talet med en logoped efter en stroke. Hon vill kunna prata som förut.",0,"”Som förut” visar att hon kunde prata förut. Nu ska hon få tillbaka det. Därför är det rehabilitering."],
   ["En ung man med intellektuell funktionsnedsättning tränar på att handla själv för första gången.",1,"”För första gången” visar att han aldrig har gjort det förut. Därför är det habilitering."],
   ["Efter en lång tid på sjukhus har patienten blivit svag. Nu tränar hon för att orka gå till affären igen.",0,"Hon orkade gå till affären förut. Nu ska hon få tillbaka orken. Därför är det rehabilitering."],
   ["En flicka med Downs syndrom tränar på att knäppa knappar.",1,"Downs syndrom har man sedan födseln. Hon lär sig något nytt. Därför är det habilitering."],
   ["Patientens fot har amputerats. Nu lär han sig gå med en protes.",0,"Han kunde gå förut. Nu ska han kunna gå igen, med hjälp av protesen. Därför är det rehabilitering."],
   ["Ett barn som föddes blint lär sig läsa punktskrift.",1,"Barnet har aldrig kunnat se. Det lär sig ett nytt sätt att läsa. Därför är det habilitering."],
   ["Efter en hjärtinfarkt tränar patienten i en grupp för att få tillbaka sin kondition.",0,"Han hade bättre kondition förut. Nu ska han få tillbaka den. Därför är det rehabilitering."],
   ["En pojke som föddes med en hjärnskada lär sig äta med en anpassad sked.",1,"Han har haft skadan sedan han föddes. Han lär sig något nytt. Därför är det habilitering."],
   ["Patienten har brutit armen. Nu tränar hon så att armen blir stark igen.",0,"Armen var stark förut. ”Igen” visar att hon ska få tillbaka styrkan. Därför är det rehabilitering."],
   ["En tonåring med ADHD får hjälp att planera skoldagen med en app.",1,"ADHD har man sedan man är liten. Tonåringen lär sig ett nytt sätt att planera. Därför är det habilitering."],
   ["En äldre man har legat i sängen med lunginflammation. Nu tränar ni på att han ska klara toalettbesöken själv igen.",0,"Han klarade toaletten själv förut. Nu ska han få tillbaka det. Därför är det rehabilitering."],
   ["En kvinna som har haft en funktionsnedsättning sedan hon föddes tränar på att bo i egen lägenhet.",1,"Hon har haft funktionsnedsättningen sedan hon föddes. Hon lär sig bo själv för första gången. Därför är det habilitering."],
   ["Patienten har varit sjukskriven för utmattning. Nu får hon hjälp att börja arbeta igen.",0,"Hon arbetade förut. Nu ska hon komma tillbaka till arbetet. Därför är det rehabilitering."],
   ["En ung kvinna med intellektuell funktionsnedsättning lär sig laga enkel mat.",1,"Hon har haft funktionsnedsättningen hela livet. Hon lär sig något nytt. Därför är det habilitering."]
  ],
  fyllI:[
   ["Efter stroken behöver patienten ___ för att kunna gå igen.",["rehabilitering","habilitering","rehabilitera"],"Han kunde gå förut. Nu ska han få tillbaka det. Därför behöver han rehabilitering. Efter ”behöver” heter det rehabilitering, inte rehabilitera."],
   ["Barn med medfödda funktionsnedsättningar får stöd från ___.",["habiliteringen","rehabiliteringen","habilitering"],"”Medfödd” betyder att man har haft det sedan födseln. Då får man habilitering. Stället heter habiliteringen."],
   ["Patienten ska ___ efter höftoperationen.",["rehabiliteras","habiliteras","rehabilitering"],"Hon kunde gå förut och ska få tillbaka det. Efter ”ska” heter det rehabiliteras. Det betyder att någon hjälper henne."],
   ["Målet med ___ är att få tillbaka det man kunde före olyckan.",["rehabiliteringen","habiliteringen","rehabilitera"],"Att få tillbaka det man kunde före olyckan är rehabilitering. Efter ”med” heter det rehabiliteringen."],
   ["Fysioterapeuten gör en ___ tillsammans med patienten efter stroken.",["rehabiliteringsplan","habiliteringsplan","rehabilitera"],"Efter en stroke ska patienten få tillbaka det hon kunde. Därför heter planen rehabiliteringsplan."],
   ["Pojken föddes med en hjärnskada. Han har haft kontakt med ___ sedan han var liten.",["habiliteringen","rehabiliteringen","habilitering"],"Pojken har haft skadan sedan han föddes. Därför har han kontakt med habiliteringen."],
   ["Inom ___ lär sig personen förmågor som hon aldrig har haft.",["habiliteringen","rehabiliteringen","habilitera"],"Att lära sig något man aldrig har kunnat är habilitering. Efter ”inom” heter det habiliteringen."],
   ["Patienten har kommit hem från sjukhuset. Nu fortsätter ___ i hemmet.",["rehabiliteringen","habiliteringen","rehabilitering"],"Patienten ska fortsätta få tillbaka det hon kunde. Vi vet vilken rehabilitering det gäller. Då heter det rehabiliteringen."],
   ["Det är viktigt att ___ börjar tidigt efter en stroke.",["rehabiliteringen","habiliteringen","rehabilitera"],"Efter en stroke ska man få tillbaka det man kunde. Vi vet vilken rehabilitering det gäller. Då heter det rehabiliteringen."],
   ["Flickan har en medfödd funktionsnedsättning. Hon har fått ___ sedan hon var liten.",["habilitering","rehabilitering","habiliteringen"],"”Medfödd” betyder sedan födseln. Därför har hon fått habilitering. Efter ”fått” heter det habilitering."],
   ["I ___ tränar barnet på saker som andra barn i samma ålder redan kan.",["habiliteringen","rehabiliteringen","habilitera"],"Barnet lär sig saker som det aldrig har kunnat. Därför är det habilitering. Efter ”i” heter det habiliteringen."],
   ["Patienten skadade ryggen på jobbet. Hon behöver ___ innan hon kan börja arbeta igen.",["rehabilitering","habilitering","rehabiliteras"],"Hon kunde arbeta förut och ska komma tillbaka. Därför behöver hon rehabilitering. Efter ”behöver” heter det rehabilitering."]

 {id:"egenvard",
  ord:[["egenvård","patienten sköter själv","I vilken situation handlar det om egenvård?"],
       ["delegering","sjuksköterskan ger dig uppdraget","I vilken situation handlar det om delegering?"]],
  fraga:"Är det egenvård eller delegering?",
  regel:"Egenvård är när läkaren eller sjuksköterskan har bestämt att patienten kan sköta något själv. Patienten har ansvaret, även om du hjälper till lite. Delegering är när sjuksköterskan ger dig uppdraget att göra en uppgift i hälso- och sjukvården. Du får ett skriftligt beslut, och då har du ansvaret för att göra uppgiften rätt. Fråga dig: vem har ansvaret, patienten eller du?",
  sortera:[
   ["Patienten tar själv sitt insulin. Läkaren har bedömt att hon klarar det.",0,"Patienten sköter det själv, och läkaren har sagt att hon klarar det. Därför är det egenvård."],
   ["Sjuksköterskan har gett dig ett skriftligt beslut om att du får ge insulin till patienten.",1,"Sjuksköterskan har gett dig uppdraget med ett skriftligt beslut. Därför är det delegering."],
   ["Läkaren har bedömt att patienten kan sköta sina ögondroppar själv, men hon behöver hjälp att hålla flaskan. Du hjälper henne.",0,"Patienten har ansvaret. Du hjälper bara till att hålla flaskan. Därför är det egenvård."],
   ["Du har gått en utbildning och fått ett beslut från sjuksköterskan. Nu får du ge patientens ögondroppar.",1,"Du har fått ett beslut från sjuksköterskan. Därför är det delegering."],
   ["Patienten sköter själv sina inhalationer varje morgon.",0,"Patienten sköter det själv. Därför är det egenvård."],
   ["Sjuksköterskan har lärt dig att lägga om patientens sår. Du har ett skriftligt beslut som gäller i ett år.",1,"Sjuksköterskan har gett dig ett skriftligt beslut. Därför är det delegering."],
   ["Patienten mäter sitt blodsocker själv och skriver ner värdet i ett häfte.",0,"Patienten mäter själv och har ansvaret. Därför är det egenvård."],
   ["Du ger patienten en spruta med blodförtunnande läkemedel. Det står i ditt beslut från sjuksköterskan att du får göra det.",1,"Du gör uppgiften för att sjuksköterskan har gett dig ett beslut. Därför är det delegering."],
   ["Patienten byter själv påsen på sin stomi.",0,"Patienten sköter det själv. Därför är det egenvård."],
   ["Ditt beslut om att mäta blodsocker har gått ut. Du måste få ett nytt beslut av sjuksköterskan innan du får göra det igen.",1,"Ett beslut från sjuksköterskan gäller bara en viss tid. Det hör till delegering."],
   ["Patienten smörjer själv in huden med den kräm som läkaren har skrivit ut.",0,"Patienten sköter behandlingen själv. Därför är det egenvård."],
   ["Sjuksköterskan kontrollerar att du kan ge läkemedel i en sond i magen. Sedan skriver hon ett beslut.",1,"Sjuksköterskan kontrollerar att du kan uppgiften och skriver ett beslut. Därför är det delegering."],
   ["Läkaren har bestämt att patienten själv ansvarar för sina tabletter. Hennes dotter hjälper henne att komma ihåg dem.",0,"Patienten har ansvaret. Dottern hjälper bara till att komma ihåg. Därför är det egenvård."],
   ["Du ger patienten tabletter ur en dosett. Sjuksköterskan har gett dig uppgiften med ett skriftligt beslut.",1,"Sjuksköterskan har gett dig uppgiften med ett skriftligt beslut. Därför är det delegering."],
   ["Patienten tar själv sina blodtryckstabletter varje morgon.",0,"Patienten sköter det själv. Därför är det egenvård."],
   ["Du har ansvar för att ge rätt läkemedel vid rätt tid. Det står i ditt beslut från sjuksköterskan.",1,"Beslutet från sjuksköterskan ger dig ansvaret för uppgiften. Därför är det delegering."],
   ["Patienten sätter själv på sin andningsmask på natten.",0,"Patienten sköter det själv. Därför är det egenvård."],
   ["Sjuksköterskan visar dig hur du sätter in ett läkemedel i ändtarmen. Sedan skriver ni båda under ett beslut.",1,"Ni skriver under ett beslut. Därför är det delegering."],
   ["Läkaren har bedömt att patienten kan sköta sina läkemedel själv. Du ställer fram vattenglaset åt henne.",0,"Patienten har ansvaret. Du hjälper bara till med glaset. Därför är det egenvård."],
   ["Patienten klarar inte längre sitt insulin själv. Sjuksköterskan ger dig och en kollega uppdraget med skriftliga beslut.",1,"Nu ger sjuksköterskan uppdraget till er med skriftliga beslut. Därför är det delegering."]
  ],
  fyllI:[
   ["Sjuksköterskan ___ insulingivningen till dig.",["delegerar","delegering","delegera"],"Sjuksköterskan ger dig uppdraget. Därför delegerar hon. Det händer nu. Då heter det delegerar."],
   ["Läkaren har bedömt att insulinet är ___. Patienten ansvarar själv.",["egenvård","delegering","delegerat"],"Patienten sköter insulinet själv och har ansvaret. Därför är det egenvård."],
   ["Du får inte ge insulin utan en skriftlig ___.",["delegering","egenvård","delegera"],"Du behöver ett uppdrag från sjuksköterskan. Därför behövs en delegering. Efter ”en skriftlig” heter det delegering, inte delegera."],
   ["Ditt ___ gäller i högst ett år.",["delegeringsbeslut","egenvårdsbedömning","delegera"],"Beslutet som du får av sjuksköterskan heter delegeringsbeslut. Det heter ”ett beslut”. Därför står det ”ditt”."],
   ["När uppgiften är ___ har patienten själv ansvaret, även om du hjälper till.",["egenvård","delegerad","delegering"],"Patienten har ansvaret. Därför är uppgiften egenvård."],
   ["Uppgiften är ___ till dig. Därför har du ansvar för att göra den rätt.",["delegerad","egenvård","delegera"],"Du har fått uppgiften av sjuksköterskan. Därför är den delegerad. Det heter ”en uppgift”. Då får ordet inget -t."],
   ["Igår ___ sjuksköterskan såromläggningen till två undersköterskor.",["delegerade","delegerar","delegering"],"Sjuksköterskan gav uppdraget. ”Igår” betyder att det redan har hänt. Då heter det delegerade."],
   ["Läkaren gör en ___ av om patienten kan sköta sina läkemedel själv.",["egenvårdsbedömning","delegering","delegera"],"Läkaren tar reda på om patienten klarar läkemedlen själv. Det kallas egenvårdsbedömning."],
   ["Om patienten inte längre klarar sin ___ måste läkaren göra en ny bedömning.",["egenvård","delegering","delegeringen"],"Det som patienten sköter själv kallas egenvård. Efter ”sin” heter det egenvård."],
   ["Sjuksköterskan har ___ uppgiften till dig, men hon har fortfarande ansvar för att du kan den.",["delegerat","delegerade","delegering"],"Sjuksköterskan har gett dig uppdraget. Efter ”har” heter det delegerat."],
   ["Du hjälper patienten att öppna förpackningen med inhalatorn. Inhalationen är ___, så patienten har ansvaret.",["egenvård","delegerad","delegering"],"Patienten har ansvaret, även om du hjälper till. Därför är det egenvård."],
   ["Innan ___ kontrollerar sjuksköterskan att du har rätt kunskaper.",["delegeringen","egenvården","delegera"],"Sjuksköterskan kontrollerar dig innan hon ger dig uppdraget. Vi vet vilken delegering det gäller. Då heter det delegeringen."]
  ]}
];

const LAGEN = {
  1:{namn:"Sortera", beskr:"Läs situationen och välj vilket av två ord som passar."},
  2:{namn:"Fyll i", beskr:"Välj rätt ord i rätt form i meningen."},
  3:{namn:"Välj exemplet", beskr:"Läs ordet och välj den situation som passar."}
};
const POANG_HEL = 2, POANG_LEDTRAD = 1;
const SORTERA_PER_RUNDA = 10, FYLLI_PER_RUNDA = 6, ANTAL_LAGE3 = 6, ANTAL_BLANDAT = 12;
// En runda drar ett urval ur gruppen. Uppgifter som eleven inte har sett på längst tid kommer först.
const FEL_FOR_KLARAD = 1;   // högst så här många fel på första försöket för att klara en grupp
const TILLBAKA_EFTER = 4;   // ett felsvar kommer tillbaka så här många uppgifter senare

/* ============================================================ */

const LARARE = /larare/i.test(location.hash + location.search);
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain = s => s.replace(/<[^>]+>/g,"");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const pick = (a,n) => shuffle(a).slice(0,n);

/* Framsteg sparas bara i den här webbläsaren */
const LAGRING = "skillnaden-framsteg";
const framsteg = {
  las(){ let d={}; try{ d=JSON.parse(localStorage.getItem(LAGRING)||"{}") }catch(e){} return {1:d[1]||{},2:d[2]||{},3:d[3]||{}} },
  klarad(lage,id){ return !!this.las()[lage][id] },
  satt(lage,id){ try{ const d=this.las(); d[lage][id]=true; localStorage.setItem(LAGRING,JSON.stringify(d)) }catch(e){} },
  last(lage,id){ return !LARARE && lage>1 && !this.klarad(lage-1,id) },
  senasteLage(){ try{ return +localStorage.getItem("skillnaden-lage")||1 }catch(e){ return 1 } },
  sparaLage(l){ try{ localStorage.setItem("skillnaden-lage",String(l)) }catch(e){} }
};

/* Vilka uppgifter eleven har sett, så att samma uppgifter inte kommer i varje runda */
const SETT = "skillnaden-sett";
let sett = {n:0,k:{}};
try{ const d=JSON.parse(localStorage.getItem(SETT)); if(d&&d.k) sett=d }catch(e){}
function sparaSett(){ try{ localStorage.setItem(SETT,JSON.stringify(sett)) }catch(e){} }
function valj(lista,n,nyckel){
  const ordning = shuffle(lista).sort((a,b)=>(sett.k[nyckel(a)]??-1)-(sett.k[nyckel(b)]??-1));
  const ut = ordning.slice(0,n);
  ut.forEach(x=>sett.k[nyckel(x)]=sett.n);
  return ut;
}
const n1 = it=>"1:"+it[0], n2 = it=>"2:"+it[0], n3 = it=>"3:"+it[0];
function valjBalanserat(lista,n,nyckel){
  const a=valj(lista.filter(it=>it[1]===0),Math.ceil(n/2),nyckel);
  const b=valj(lista.filter(it=>it[1]===1),n-a.length,nyckel);
  return shuffle(a.concat(b));
}

/* Uppläsning: webbläsarens egen svenska röst, samma val som i Ett pass */
let rost = null;
const kanTala = "speechSynthesis" in window;
function hittaRost(){ if(!kanTala) return; const v=speechSynthesis.getVoices();
  rost = v.find(x=>/^sv/i.test(x.lang)&&/google/i.test(x.name)) || v.find(x=>/^sv/i.test(x.lang)) || null }
if(kanTala){ hittaRost(); speechSynthesis.onvoiceschanged=hittaRost }
function tala(t){ if(!kanTala||!t) return; try{ speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[”"]/g,"")); u.lang="sv-SE"; if(rost) u.voice=rost; u.rate=.9;
  speechSynthesis.speak(u) }catch(e){} }
function tyst(){ try{ kanTala&&speechSynthesis.cancel() }catch(e){} }
const HOGTALARE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;

/* ---------- Bygga uppgifter ---------- */
function uppgiftLage1(g,it){
  return {lage:1,g,fraga:g.fraga,html:it[0],lasText:plain(it[0]),
    alt:g.ord.map((o,i)=>({html:esc(o[0]),vard:o[1],ratt:i===it[1]})),
    rattOrd:g.ord[it[1]][0], varfor:it[2], fast:true, item:it};
}
function uppgiftLage2(g,it){
  const [mening,former,varfor]=it;
  const html = esc(mening).replace("___",'<span class="gap" aria-label="lucka">&nbsp;</span>');
  return {lage:2,g,fraga:"Vilket ord passar i luckan?",html,lasText:mening.replace("___","lucka"),
    alt:former.map((f,i)=>({html:esc(f),ratt:i===0,form:f})), rattOrd:former[0], varfor, item:it};
}
function uppgiftLage3(g,t,ratt,fel){
  const alt = [ratt,...fel].map(it=>({html:it[0],lasText:plain(it[0]),ratt:it===ratt,varfor:it[2]}));
  return {lage:3,g,fraga:g.ord[t][2],term:g.ord[t][0],html:"",
    lasText:g.ord[t][2]+" "+alt.map((a,i)=>(i+1)+". "+a.lasText).join(" "),
    alt, rattOrd:g.ord[t][0], varfor:ratt[2], item:ratt};
}
function lage3For(g,n){
  // Rätt situation väljs bland dem eleven inte har sett på länge. De två felaktiga lottas, så kombinationen blir ny varje gång.
  return valjBalanserat(g.sortera,n,n3).map(ratt=>
    uppgiftLage3(g,ratt[1],ratt,pick(g.sortera.filter(it=>it[1]!==ratt[1]),2)));
}
function byggRunda(lage,id){
  if(id==="mix"){
    const grupper=GRUPPER.filter(g=>!framsteg.last(lage,g.id));
    const alla = lage===2 ? grupper.flatMap(g=>g.fyllI.map(it=>({g,it}))) : grupper.flatMap(g=>g.sortera.map(it=>({g,it})));
    const nyckel = lage===1?n1:lage===2?n2:n3;
    return valj(alla,ANTAL_BLANDAT,x=>nyckel(x.it)).map(({g,it})=>
      lage===1?uppgiftLage1(g,it):lage===2?uppgiftLage2(g,it):uppgiftLage3(g,it[1],it,pick(g.sortera.filter(x=>x[1]!==it[1]),2)));
  }
  const g=GRUPPER.find(x=>x.id===id);
  if(lage===1) return valjBalanserat(g.sortera,SORTERA_PER_RUNDA,n1).map(it=>uppgiftLage1(g,it));
  if(lage===2) return valj(g.fyllI,FYLLI_PER_RUNDA,n2).map(it=>uppgiftLage2(g,it));
  return lage3For(g,ANTAL_LAGE3);
}

/* ---------- Meny ---------- */
let valtLage = framsteg.senasteLage();
let S = null;

function meny(){
  S=null; tyst();
  const L=valtLage;
  const oppna=GRUPPER.filter(g=>!framsteg.last(L,g.id));
  app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:8px">
      <a href="../" class="back" style="align-self:flex-start;text-decoration:none">← Alla spel</a>
      <h1>Skillnaden</h1>
      <p class="lead">Ord som ligger nära varandra. Träna på att se skillnaden.</p>
    </header>
    <div class="tabs" role="tablist">
      ${[1,2,3].map(n=>`<button class="tab" role="tab" aria-selected="${n===L}" data-l="${n}">
        <span class="n">Läge ${n}</span><span class="t">${LAGEN[n].namn}</span></button>`).join("")}
    </div>
    <p class="modedesc">${LAGEN[L].beskr}${L>1?` En grupp öppnas när du har klarat den i läge ${L-1}.`:""}</p>
    ${LARARE?`<p class="teacher">Lärarläge: alla grupper är öppna.</p>`:""}
    <div class="groups">
      ${GRUPPER.map(g=>{
        const last=framsteg.last(L,g.id), klar=framsteg.klarad(L,g.id);
        const antal = L===1?Math.min(SORTERA_PER_RUNDA,g.sortera.length):L===2?Math.min(FYLLI_PER_RUNDA,g.fyllI.length):ANTAL_LAGE3;
        return `<button class="g" data-id="${g.id}" ${last?"disabled":""}>
          <span class="pair">${g.ord.map(o=>o[0]).join(" / ")}</span>
          <span class="meta"><span>${last?`Klara läge ${L-1} först`:antal+" uppgifter"}</span>${klar?'<span class="chip">Klarad</span>':""}</span>
        </button>`}).join("")}
      ${oppna.length>=2?`<button class="g mix" data-id="mix">
        <span class="pair">Blandat</span>
        <span class="meta"><span>${ANTAL_BLANDAT} från ${oppna.length===GRUPPER.length?"alla grupper":"öppna grupper"}</span></span>
      </button>`:""}
    </div>`;
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ valtLage=+b.dataset.l; framsteg.sparaLage(valtLage); meny() });
  app.querySelectorAll(".g").forEach(b=>b.onclick=()=>starta(valtLage,b.dataset.id));
}

/* ---------- Spel ---------- */
function starta(lage,id){
  sett.n++;
  const ko=byggRunda(lage,id);
  sparaSett();
  S={lage,id,ko,pos:0,antal:ko.length,poang:0,max:ko.length*POANG_HEL,forsta:0,missade:[],fel:new Set(),ledtrad:false,svarat:false,ordning:null};
  visaUppgift();
}

function visaUppgift(){
  const u=S.ko[S.pos];
  S.ordning = u.fast ? u.alt : shuffle(u.alt);
  const kort = u.lage===3
    ? `<div class="card"><p class="txt"><span class="term">${esc(u.term)}</span></p>${kanTala?`<button class="speak" id="tala" aria-label="Läs upp">${HOGTALARE}</button>`:""}</div>`
    : `<div class="card"><p class="txt">${u.html}</p>${kanTala?`<button class="speak" id="tala" aria-label="Läs upp">${HOGTALARE}</button>`:""}</div>`;
  app.innerHTML = `
    <div class="bar">
      <button class="back" id="tillbaka">← Grupper</button>
      <div class="prog" aria-hidden="true"><i style="width:${Math.round(S.pos/S.ko.length*100)}%"></i></div>
      <span class="score" id="poang">${S.poang} p</span>
    </div>
    <p class="ask">${esc(u.fraga)}</p>
    ${kort}
    <div class="answers m${u.lage}">
      ${S.ordning.map((a,i)=>`
        <button class="ans" data-i="${i}">
          <span class="w">${a.html}</span>
          ${u.lage===1?`<span class="v" ${S.ledtrad?"":"hidden"}>${esc(a.vard)}</span>
          <span class="key" aria-hidden="true">${i?"→":"←"}</span>`:""}
        </button>`).join("")}
    </div>
    <div class="hintbox" id="hintbox" ${S.ledtrad&&u.lage>1?"":"hidden"}>${u.g.ord.map(o=>`<span><b>${esc(o[0])}</b> = ${esc(o[1])}</span>`).join("")}</div>
    <button class="hint" id="ledtrad" ${S.ledtrad?"disabled":""}>${S.ledtrad?"Vardagsord visas":"Visa vardagsord (ger 1 poäng i stället för 2)"}</button>
    <div id="fb"></div>`;
  document.getElementById("tillbaka").onclick=meny;
  document.getElementById("ledtrad").onclick=visaLedtrad;
  const tb=document.getElementById("tala"); if(tb) tb.onclick=()=>tala(u.lasText);
  app.querySelectorAll(".ans").forEach(b=>b.onclick=()=>svara(+b.dataset.i));
}

function visaLedtrad(){
  if(S.svarat||S.ledtrad) return;
  S.ledtrad=true;
  app.querySelectorAll(".ans .v").forEach(v=>v.hidden=false);
  const hb=document.getElementById("hintbox"); if(hb&&S.ko[S.pos].lage>1) hb.hidden=false;
  const h=document.getElementById("ledtrad"); h.disabled=true; h.textContent="Vardagsord visas";
}

function svara(i){
  if(S.svarat) return;
  S.svarat=true;
  const u=S.ko[S.pos], vald=S.ordning[i], ratt=vald.ratt;
  const forsta=!S.fel.has(u);
  if(ratt){ if(forsta){ S.forsta++; S.poang+=S.ledtrad?POANG_LEDTRAD:POANG_HEL } }
  else {
    if(forsta){ S.fel.add(u); S.missade.push(u) }
    S.ko.splice(Math.min(S.pos+TILLBAKA_EFTER,S.ko.length),0,u);
  }
  app.querySelectorAll(".ans").forEach(b=>{
    const a=S.ordning[+b.dataset.i]; b.disabled=true;
    b.classList.add(a.ratt?"right":(a===vald?"wrong":"dim"));
  });
  document.getElementById("ledtrad").disabled=true;
  document.getElementById("poang").textContent=S.poang+" p";
  let html;
  if(ratt) html=`<div class="fb ok"><strong>Rätt.</strong><p>${esc(u.varfor)}</p></div>`;
  else {
    const rubrik = u.lage===3 ? "Inte den här." : `Rätt svar: ${esc(u.rattOrd)}`;
    const valdInfo = u.lage===3 ? `<p class="small">Det du valde: ${esc(vald.varfor)}</p><p>Rätt situation: ${esc(u.varfor)}</p>` : `<p>${esc(u.varfor)}</p>`;
    html=`<div class="fb bad"><strong>${rubrik}</strong>${valdInfo}<p class="rule">${esc(u.g.regel)}</p><p class="small">Uppgiften kommer tillbaka lite senare.</p></div>`;
  }
  const fb=document.getElementById("fb"); fb.innerHTML=html;
  const nb=document.createElement("button"); nb.className="next"; nb.id="nasta";
  nb.textContent=S.pos+1>=S.ko.length?"Se resultat":"Nästa";
  nb.onclick=nasta; fb.firstChild.appendChild(nb); nb.focus();
}

function nasta(){
  tyst();
  S.pos++; S.ledtrad=false; S.svarat=false;
  if(S.pos>=S.ko.length) return resultat();
  visaUppgift(); window.scrollTo(0,0);
}

function resultat(){
  const klarade=S.missade.length<=FEL_FOR_KLARAD;
  const nyOppnad = klarade && S.id!=="mix" && S.lage<3 && !framsteg.klarad(S.lage,S.id);
  if(klarade&&S.id!=="mix") framsteg.satt(S.lage,S.id);
  const g=GRUPPER.find(x=>x.id===S.id);
  let text;
  if(S.id==="mix") text="";
  else if(klarade) text = S.lage<3 ? ` Gruppen är klarad${nyOppnad?` och har öppnats i läge ${S.lage+1}`:""}.` : " Gruppen är klarad i alla tre lägen.";
  else text = ` Du klarar gruppen när du har högst ${FEL_FOR_KLARAD} fel på första försöket. Spela gärna en gång till.`;
  app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:10px">
      <h2>${klarade?"Bra jobbat!":"Rundan är klar"}</h2>
      <p class="big">${S.poang}<span style="font-size:1.25rem;color:var(--muted)"> / ${S.max} p</span></p>
      <p class="lead">Rätt på första försöket: ${S.forsta} av ${S.antal}.${text}</p>
    </header>
    ${S.missade.length?`
      <section style="display:flex;flex-direction:column;gap:10px">
        <h2 style="font-size:1.1rem">Det här var svårt</h2>
        <ul class="missed">${S.missade.map(u=>`<li>${u.lage===3?`<span class="a">${esc(u.term)}</span>: ${u.item[0]}`:u.lage===2?`${esc(u.item[0]).replace("___",`<span class="a">${esc(u.rattOrd)}</span>`)}`:`${u.html}<br><span class="a">${esc(u.rattOrd)}</span>`} <br>${esc(u.varfor)}</li>`).join("")}</ul>
      </section>`:""}
    <div class="row">
      ${nyOppnad?`<button class="next" id="vidare">Fortsätt till läge ${S.lage+1}</button>`:""}
      <button class="${nyOppnad?"btn2":"next"}" id="igen">Spela igen</button>
      <button class="btn2" id="meny">Välj grupp</button>
    </div>`;
  const lage=S.lage,id=S.id;
  document.getElementById("igen").onclick=()=>starta(lage,id);
  document.getElementById("meny").onclick=()=>{ valtLage=lage; meny() };
  const v=document.getElementById("vidare"); if(v) v.onclick=()=>{ valtLage=lage+1; framsteg.sparaLage(valtLage); starta(lage+1,id) };
  window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  if(!S||!document.querySelector(".ans")) return;
  const u=S.ko[S.pos];
  if(!S.svarat){
    if(u.lage===1&&e.key==="ArrowLeft") return svara(0);
    if(u.lage===1&&e.key==="ArrowRight") return svara(1);
    const n=parseInt(e.key,10); if(n>=1&&n<=S.ordning.length) return svara(n-1);
  } else if(e.key==="Enter"&&document.activeElement?.id!=="nasta"){ e.preventDefault(); nasta() }
});

meny();
</script>
</body>
</html>
